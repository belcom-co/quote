      <button class="btn btn-secondary btn-sm" onclick="moveGroup('${grp.id}',-1)"${gi===0?' disabled':''} title="위로">▲</button>
      <button class="btn btn-secondary btn-sm" onclick="moveGroup('${grp.id}',1)"${gi===quoteGroups.length-1?' disabled':''} title="아래로">▼</button>
      <button class="btn btn-danger btn-sm" onclick="deleteGroup('${grp.id}')">그룹 삭제</button>
    </div>
  </div>
  <div style="overflow-x:auto">
    <table class="group-qtable" style="min-width:700px">${tableHead}<tbody class="group-items-tbody" data-group-id="${grp.id}">${buildRows(grp.items, grp.id)}</tbody></table>
  </div>
  ${grp.showSubtotal?`<div class="group-subtotal-row" data-subtotal="${grp.id}">소계: 공급가액 ${fmt(sub)}원 &nbsp;/&nbsp; 세액 ${fmt(subTax)}원 &nbsp;/&nbsp; 합계 ${fmt(sub+subTax)}원</div>`:''}
</div>`;
  }).join('');

  if (ungroupedItems.length) {
    html += `<div class="ungrouped-section">
  <div class="ungrouped-header">기타 항목 (그룹 미지정)</div>
  <div style="overflow-x:auto">
    <table class="group-qtable" style="min-width:700px">${tableHead}<tbody class="group-items-tbody" data-group-id="__ungrouped__">${buildRows(ungroupedItems,'__ungrouped__')}</tbody></table>
  </div>
</div>`;
  }

  container.innerHTML = html;
  updateTotals();
  updateActiveGroupHint();
  initSortables();
  updateCopyQuoteBtnVisibility();
}

function updateActiveGroupHint() {
  const el = document.getElementById('active-group-hint');
  if (!el) return;
  const grp = quoteGroups.find(g => g.id === activeGroupId);
  el.textContent = grp ? `"${grp.name}" 선택됨 — 좌측에서 항목 추가` : '그룹 선택 후 좌측에서 항목 추가';
}

function updateGroupItem(gid, i, field, val) {
  const items = gid === '__ungrouped__' ? ungroupedItems : (quoteGroups.find(g=>g.id===gid)||{items:[]}).items;
  if (!items[i]) return;
  items[i][field] = (field==='qty'||field==='price') ? (parseFloat(val)||0) : val;
  if (field==='qty'||field==='price') {
    const sup = items[i].qty * items[i].price;
    const tax = Math.round(sup * 0.1);
    const key = gid + '_' + i;
    const supEl = document.querySelector(`[data-sup="${key}"]`);
    const taxEl = document.querySelector(`[data-tax="${key}"]`);
    if (supEl) supEl.textContent = fmt(sup);
    if (taxEl) taxEl.textContent = fmt(tax);
    if (gid !== '__ungrouped__') {
      const grp = quoteGroups.find(g=>g.id===gid);
      if (grp && grp.showSubtotal) {
        const sub = grp.items.reduce((s,it)=>s+it.qty*it.price,0);
        const subTax = Math.round(sub*0.1);
        const stEl = document.querySelector(`[data-subtotal="${gid}"]`);
        if (stEl) stEl.textContent = `소계: 공급가액 ${fmt(sub)}원 \xa0/\xa0 세액 ${fmt(subTax)}원 \xa0/\xa0 합계 ${fmt(sub+subTax)}원`;
      }
    }
  }
  updateTotals();
}

function deleteGroupItem(gid, i) {
  if (gid === '__ungrouped__') ungroupedItems.splice(i,1);
  else { const grp=quoteGroups.find(g=>g.id===gid); if(grp) grp.items.splice(i,1); }
  renderQuoteTable();
}

function updateTotals() {
  let sup = 0, tax = 0;
  quoteGroups.forEach(grp => grp.items.forEach(it => { const s=it.qty*it.price; sup+=s; tax+=Math.round(s*0.1); }));
  ungroupedItems.forEach(it => { const s=it.qty*it.price; sup+=s; tax+=Math.round(s*0.1); });
  document.getElementById('total-supply').textContent = fmt(sup);
  document.getElementById('total-tax').textContent    = fmt(tax);
  document.getElementById('total-grand').textContent  = fmt(sup+tax);
}

// ===== 이미지 시트 기능 (v3) =====
function imgNewId() { return 'img' + Date.now() + Math.random().toString(36).slice(2,5); }

// pageIndex/cellIndex 없는 구 형식 이미지 마이그레이션
function migrateImgSheet(sheet) {
  const { cols, rows } = IS_LAYOUTS[sheet.layout] || IS_LAYOUTS['2x2'];
  const perPage = cols * rows;
  sheet.images.forEach((im, idx) => {
    if (im.pageIndex === undefined || im.cellIndex === undefined) {
      im.pageIndex = Math.floor(idx / perPage);
      im.cellIndex = idx % perPage;
    }
    if (im.split === undefined) im.split = null;
  });
  if (!sheet.cellSplits) sheet.cellSplits = {};
  const maxPage = sheet.images.reduce((mx, im) => Math.max(mx, im.pageIndex || 0), 0);
  sheet.pageCount = Math.max(sheet.pageCount || 1, maxPage + 1);
  return sheet;
}

function getImgAtCell(pageIndex, cellIndex) {
  return imageSheet.images.find(im => im.pageIndex === pageIndex && im.cellIndex === cellIndex && !im.split);
}

function getImgAtSubCell(pageIndex, cellIndex, splitPos) {
  return imageSheet.images.find(im => im.pageIndex === pageIndex && im.cellIndex === cellIndex && im.split === splitPos);
}

function findNextFreeCell() {
  const { cols, rows } = IS_LAYOUTS[imageSheet.layout] || IS_LAYOUTS['2x2'];
  const perPage = cols * rows;
  for (let p = 0; p < imageSheet.pageCount; p++) {
    for (let ci = 0; ci < perPage; ci++) {
      const key = `${p}-${ci}`;
      if (!getImgAtCell(p, ci) && !(imageSheet.cellSplits || {})[key]) return { pageIndex: p, cellIndex: ci };
    }
  }
  return null;
}

// ===== 레이아웃 저장/복원 =====
const LAYOUT_KEY = 'quoteLayoutV1';

function saveLayout() {
  const lp = document.getElementById('left-panel');
  const sec = document.getElementById('imgsheet-section');
  localStorage.setItem(LAYOUT_KEY, JSON.stringify({
    leftWidth: lp ? Math.round(lp.getBoundingClientRect().width) : 270,
    rightWidth: sec ? Math.round(sec.getBoundingClientRect().width) : 900,
    imageSheetOpen: sec ? sec.classList.contains('open') : false
  }));
}

function loadLayout() {
  const saved = localStorage.getItem(LAYOUT_KEY);
  const lp = document.getElementById('left-panel');
  const sec = document.getElementById('imgsheet-section');
  const rr = document.getElementById('resizer-right');
  const btn = document.getElementById('imgsheet-toggle-btn');
  if (saved) {
    try {
      const layout = JSON.parse(saved);
      if (layout.leftWidth && lp) lp.style.width = layout.leftWidth + 'px';
      if (layout.imageSheetOpen && sec) {
        if (layout.rightWidth) sec.style.width = layout.rightWidth + 'px';
        sec.classList.add('open');
        if (rr) rr.style.display = 'block';
        if (btn) btn.textContent = '이미지 시트 ◀';
        renderImgSheetPages();
      }
    } catch(e) {}
  }
  // 1600px 미만 화면에서는 기본 닫힌 상태 유지
  if (window.innerWidth < 1600 && sec && !saved) {
    sec.classList.remove('open');
  }
}

function toggleImgSheet() {
  const sec = document.getElementById('imgsheet-section');
  const btn = document.getElementById('imgsheet-toggle-btn');
  const rr = document.getElementById('resizer-right');
  const open = sec.classList.toggle('open');
  btn.textContent = open ? '이미지 시트 ◀' : '이미지 시트 ▶';
  if (rr) rr.style.display = open ? 'block' : 'none';
  if (open) renderImgSheetPages();
  saveLayout();
  // 뒤로가기 지원: 이미지 시트 상태를 history에 반영
  if (!_navLock) _pushNavState({ tab: 'quote', imgSheet: open });
}

// ===== 세로 리사이저 =====
(function() {
  function makeVResizer(resizerId, getTarget, getMin, getMax, invert) {
    let dragging = false, startX = 0, startW = 0;
    document.addEventListener('DOMContentLoaded', () => {
      const resizer = document.getElementById(resizerId);
      if (!resizer) return;
      resizer.addEventListener('mousedown', e => {
        dragging = true;
        startX = e.clientX;
        startW = getTarget().getBoundingClientRect().width;
        resizer.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        e.preventDefault();
      });
      document.addEventListener('mousemove', e => {
        if (!dragging) return;
        const delta = invert ? (startX - e.clientX) : (e.clientX - startX);
        const newW = Math.max(getMin(), Math.min(getMax(), startW + delta));
        getTarget().style.width = newW + 'px';
        saveLayout();
      });
      document.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false;
        resizer.classList.remove('dragging');
        document.body.style.cursor = '';
      });
    });
  }

  // 좌↔중 리사이저: left-panel 폭 조절 (200~400px)
  makeVResizer('resizer-left',
    () => document.getElementById('left-panel'),
    () => 200,
    () => 400
  );

  // 중↔우 리사이저: 이미지 시트 폭 조절 (400~화면너비-600px), 방향 반전
  makeVResizer('resizer-right',
    () => document.getElementById('imgsheet-section'),
    () => 400,
    () => Math.max(400, window.innerWidth - 600),
    true
  );
}());

function updateImgSheetLayout(val) {
  imageSheet.layout = val;
  migrateImgSheet(imageSheet); // 레이아웃 변경 시 재배치
  renderImgSheetPages();
}

function updateImgSheetCaption(val) {
  imageSheet.captionPosition = val;
  renderImgSheetPages();
}

function sanitizeSheetName(name) {
  return (name||'').trim().replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31) || '이미지 시트';
}
function updateImgSheetName(val) {
  imageSheet.sheetName = sanitizeSheetName(val);
}

function addImgSheetPage() {
  insertImgSheetPage(imageSheet.pageCount || 1);
}

function insertImgSheetPage(insertBefore) {
  imageSheet.images.forEach(im => { if (im.pageIndex >= insertBefore) im.pageIndex++; });
  const newSplits = {};
  Object.entries(imageSheet.cellSplits || {}).forEach(([key, val]) => {
    const [pg, ci] = key.split('-').map(Number);
    newSplits[pg >= insertBefore ? `${pg+1}-${ci}` : key] = val;
  });
  imageSheet.cellSplits = newSplits;
  imageSheet.pageCount = (imageSheet.pageCount || 1) + 1;
  renderImgSheetPages();
}

function deleteImgSheetPage(p) {
  const onPage = imageSheet.images.filter(im => im.pageIndex === p);
  if (onPage.length && !confirm(`페이지 ${p+1}의 이미지 ${onPage.length}개를 함께 삭제하시겠습니까?`)) return;
  onPage.forEach(im => {
    if (im.storagePath && window.fbStorage && window.fbStorageFS) {
      const { ref: sRef, deleteObject } = window.fbStorageFS;
      deleteObject(sRef(window.fbStorage, im.storagePath)).catch(() => {});
    }
  });
  imageSheet.images = imageSheet.images.filter(im => im.pageIndex !== p);
  imageSheet.images.forEach(im => { if (im.pageIndex > p) im.pageIndex--; });
  const newSplits = {};
  Object.entries(imageSheet.cellSplits || {}).forEach(([key, val]) => {
    const [pg, ci] = key.split('-').map(Number);
    if (pg === p) return;
    newSplits[pg > p ? `${pg-1}-${ci}` : key] = val;
  });
  imageSheet.cellSplits = newSplits;
  imageSheet.pageCount = Math.max(1, (imageSheet.pageCount || 1) - 1);
  renderImgSheetPages();
}

// ===== 활성 셀 (Ctrl+V 붙여넣기 타깃) =====
function setActiveCell(p, ci, split) {
  clearActiveCell();
  activeCell = { pageIndex: p, cellIndex: ci, split: split ?? null };
  const key = split ? `${p}-${ci}-${split}` : null;
  const el = key
    ? document.querySelector(`[data-slot-key="${key}"]`)
    : document.querySelector(`[data-cell-key="${p}-${ci}"]`);
  if (el) el.classList.add('is-cell-active');
}
function clearActiveCell() {
  activeCell = null;
  document.querySelectorAll('.is-cell-active').forEach(el => el.classList.remove('is-cell-active'));
}

// 빈 셀 클릭: 첫 클릭 → 활성화, 이미 활성화된 셀 클릭 → 파일 선택 열기
function emptyCellClick(e, p, ci) {
  if (activeCell?.pageIndex === p && activeCell?.cellIndex === ci && !activeCell?.split) {
    openCellPicker(p, ci);
    clearActiveCell();
  } else {
    setActiveCell(p, ci, null);
  }
}
// 이미지 있는 셀 클릭 → 활성화 (Ctrl+V로 교체 가능)
function imgCellClick(e, p, ci) {
  if (e.target.classList.contains('is-del-btn') || e.target.classList.contains('is-caption-input')) return;
  setActiveCell(p, ci, null);
}

// 분할 슬롯 — 빈 슬롯 클릭: 첫 클릭 → 활성화, 이미 활성화 → 파일 선택 열기
function emptySplitSlotClick(e, p, ci, splitPos) {
  if (e.target.classList.contains('is-del-btn')) return;
  if (activeCell?.pageIndex === p && activeCell?.cellIndex === ci && activeCell?.split === splitPos) {
    openSplitCellPicker(p, ci, splitPos);
    clearActiveCell();
  } else {
    setActiveCell(p, ci, splitPos);
  }
}
// 분할 슬롯 — 이미지 있는 슬롯 클릭 → 활성화 (Ctrl+V로 교체 가능)
function imgSplitSlotClick(e, p, ci, splitPos) {
  if (e.target.classList.contains('is-del-btn') || e.target.classList.contains('is-caption-input')) return;
  setActiveCell(p, ci, splitPos);
}

// 빈 셀 클릭 시 해당 위치로 업로드 (hidden file input 재사용)
function openCellPicker(pageIndex, cellIndex) {
  const inp = document.getElementById('is-cell-picker');
  if (!inp) return;
  inp._targetPage = pageIndex;
  inp._targetCell = cellIndex;
  inp._targetSplit = null;
  inp.click();
}

function openSplitCellPicker(p, ci, splitPos) {
  const inp = document.getElementById('is-cell-picker');
  if (!inp) return;
  inp._targetPage = p;
  inp._targetCell = ci;
  inp._targetSplit = splitPos;
  inp.click();
}

function splitCell(p, ci, type) {
  if (!imageSheet.cellSplits) imageSheet.cellSplits = {};
  const key = `${p}-${ci}`;
  if (imageSheet.cellSplits[key]) return;
  const existingImg = getImgAtCell(p, ci);
  if (existingImg) existingImg.split = type === 'horizontal' ? 'top' : 'left';
  imageSheet.cellSplits[key] = type;
  renderImgSheetPages();
}

function mergeCell(p, ci) {
  if (!imageSheet.cellSplits) return;
  const key = `${p}-${ci}`;
  const splitType = imageSheet.cellSplits[key];
  if (!splitType) return;
  const part1 = splitType === 'horizontal' ? 'top' : 'left';
  const part2 = splitType === 'horizontal' ? 'bottom' : 'right';
  const label1 = splitType === 'horizontal' ? '상단' : '좌측';
  const label2 = splitType === 'horizontal' ? '하단' : '우측';
  const img1 = getImgAtSubCell(p, ci, part1);
  const img2 = getImgAtSubCell(p, ci, part2);
  if (img1 && img2) {
    const keepFirst = confirm(`이미지 2개가 있습니다.\n확인: ${label1} 유지 (${label2} 삭제)\n취소: ${label2} 유지 (${label1} 삭제)`);
    const toDelete = keepFirst ? img2 : img1;
    const toKeep   = keepFirst ? img1 : img2;
    deleteImgFile(toDelete.id);
    toKeep.split = null;
  } else if (img1) { img1.split = null; }
    else if (img2) { img2.split = null; }
  delete imageSheet.cellSplits[key];
  renderImgSheetPages();
}

async function handleImgSheetFiles(files, targetPageIndex, targetCellIndex, targetSplitPos) {
  if (!files || !files.length) return;
  const validFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (!validFiles.length) return;
  if (!editingQuoteId) editingQuoteId = Date.now().toString();
  const sec = document.getElementById('imgsheet-section');
  if (!sec.classList.contains('open')) toggleImgSheet();
  let tPage = targetPageIndex, tCell = targetCellIndex, tSplit = targetSplitPos ?? null;
  for (const file of validFiles) {
    if (imageSheet.images.filter(im => !im.error).length >= 50) { alert('이미지는 최대 50장까지 추가할 수 있습니다.'); break; }
    if (file.size > 20 * 1024 * 1024) { alert(`"${file.name}"이 20MB를 초과합니다. 건너뜁니다.`); continue; }
    if (tPage !== undefined && tCell !== undefined) {
      await uploadImgFile(file, tPage, tCell, tSplit);
      tPage = undefined; tCell = undefined; tSplit = null;
    } else {
      // 자동으로 다음 빈 셀 탐색 (없으면 새 페이지 자동 추가)
      let free = findNextFreeCell();
      if (!free) { imageSheet.pageCount = (imageSheet.pageCount||1)+1; free = findNextFreeCell(); }
      if (free) await uploadImgFile(file, free.pageIndex, free.cellIndex, null);
    }
  }
}

async function uploadImgFile(file, pageIndex, cellIndex, split = null) {
  if (!window.fbStorage || !window.fbStorageFS) { alert('Firebase Storage가 초기화되지 않았습니다.'); return; }
  const id = imgNewId();
  imageSheet.images.push({ id, url: '', caption: '', storagePath: '', pageIndex, cellIndex, split: split||null, uploading: true });
  renderImgSheetPages();
  try {
    const { ref: sRef, uploadBytesResumable, getDownloadURL } = window.fbStorageFS;
    const path = `quotes/${editingQuoteId}/imagesheet/${Date.now()}_${file.name}`;
    const fileRef = sRef(window.fbStorage, path);
    await new Promise((resolve, reject) => {
      const task = uploadBytesResumable(fileRef, file);
      task.on('state_changed', null, reject, () => resolve());
    });
    const url = await getDownloadURL(fileRef);
    const idx = imageSheet.images.findIndex(im => im.id === id);
    if (idx >= 0) imageSheet.images[idx] = { id, url, caption: '', storagePath: path, pageIndex, cellIndex, split: split||null, uploading: false };
  } catch(e) {
    console.error('이미지 업로드 오류:', e);
    const idx = imageSheet.images.findIndex(im => im.id === id);
    if (idx >= 0) imageSheet.images[idx] = { ...imageSheet.images[idx], uploading: false, error: '업로드 실패' };
  }
  renderImgSheetPages();
}

async function deleteImgFile(id) {
  const img = imageSheet.images.find(im => im.id === id);
  if (!img) return;
  if (img.storagePath && window.fbStorage && window.fbStorageFS) {
    try {
      const { ref: sRef, deleteObject } = window.fbStorageFS;
      await deleteObject(sRef(window.fbStorage, img.storagePath));
    } catch(e) { console.warn('Storage 삭제 오류:', e); }
  }
  imageSheet.images = imageSheet.images.filter(im => im.id !== id);
  renderImgSheetPages();
}

function updateImgCaption(id, val) {
  const img = imageSheet.images.find(im => im.id === id);
  if (img) img.caption = val;
}

// 드래그 시작: {pageIndex, cellIndex} 저장
let isDragSrc  = null;
let activeCell = null; // { pageIndex, cellIndex, split } — Ctrl+V 붙여넣기 대상 셀
function imgDragStart(e, p, ci) {
  isDragSrc = { pageIndex: p, cellIndex: ci };
  e.dataTransfer.effectAllowed = 'move';
}
function imgDragOver(e) {
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.is-cell,.is-split-slot').forEach(c => c.classList.remove('drag-over'));
  e.currentTarget.classList.add('drag-over');
}
function imgDrop(e, p, ci) {
  e.preventDefault();
  if (!isDragSrc) return;
  const src = isDragSrc; isDragSrc = null;
  performPush(src.pageIndex, src.cellIndex, src.split ?? null, p, ci, null);
}
function imgDragEnd() {
  isDragSrc = null;
  document.querySelectorAll('.is-cell,.is-split-slot').forEach(c => c.classList.remove('drag-over'));
}

function imgDragStartSplit(e, p, ci, splitPos) {
  isDragSrc = { pageIndex: p, cellIndex: ci, split: splitPos };
  e.dataTransfer.effectAllowed = 'move';
  e.stopPropagation();
}
function imgDropSplit(e, p, ci, splitPos) {
  e.preventDefault(); e.stopPropagation();
  if (!isDragSrc) return;
  const src = isDragSrc; isDragSrc = null;
  performPush(src.pageIndex, src.cellIndex, src.split ?? null, p, ci, splitPos);
}

// ===== 슬롯 관리 (밀기 방식 v4) =====
function getPageSlots(p) {
  const { cols, rows } = IS_LAYOUTS[imageSheet.layout] || IS_LAYOUTS['2x2'];
  const perPage = cols * rows;
  const slots = [];
  for (let ci = 0; ci < perPage; ci++) {
    const splitType = (imageSheet.cellSplits || {})[`${p}-${ci}`];
    if (splitType === 'horizontal') {
      slots.push({ pageIndex: p, cellIndex: ci, split: 'top' });
      slots.push({ pageIndex: p, cellIndex: ci, split: 'bottom' });
    } else if (splitType === 'vertical') {
      slots.push({ pageIndex: p, cellIndex: ci, split: 'left' });
      slots.push({ pageIndex: p, cellIndex: ci, split: 'right' });
    } else {
      slots.push({ pageIndex: p, cellIndex: ci, split: null });
    }
  }
  return slots;
}

function isPageEmpty(p) {
  return !imageSheet.images.some(im => im.pageIndex === p);
}

function getAllSlots() {
  const slots = [];
  for (let p = 0; p < (imageSheet.pageCount || 1); p++) {
    if (!isPageEmpty(p)) slots.push(...getPageSlots(p));
  }
  return slots;
}

function getImgAtSlot(s) {
  if (s.split) {
    return imageSheet.images.find(im => im.pageIndex === s.pageIndex && im.cellIndex === s.cellIndex && im.split === s.split) ?? null;
  }
  return imageSheet.images.find(im => im.pageIndex === s.pageIndex && im.cellIndex === s.cellIndex && !im.split) ?? null;
}

function performPush(srcPage, srcCell, srcSplit, dstPage, dstCell, dstSplit) {
  srcSplit = srcSplit ?? null;
  dstSplit = dstSplit ?? null;
  if (srcPage === dstPage && srcCell === dstCell && srcSplit === dstSplit) return;
  const srcImg = srcSplit ? getImgAtSubCell(srcPage, srcCell, srcSplit) : getImgAtCell(srcPage, srcCell);
  if (!srcImg) return;
  // 완전히 빈 페이지로 이동: 단순 이동
  if (dstPage !== srcPage && isPageEmpty(dstPage)) {
    srcImg.pageIndex = dstPage;
    srcImg.cellIndex = dstCell;
    srcImg.split = dstSplit;
    renderImgSheetPages();
    return;
  }
  const slots = getAllSlots();
  const srcIdx = slots.findIndex(s => s.pageIndex === srcPage && s.cellIndex === srcCell && s.split === srcSplit);
  const dstIdx = slots.findIndex(s => s.pageIndex === dstPage && s.cellIndex === dstCell && s.split === dstSplit);
  if (srcIdx < 0 || dstIdx < 0) return;
  const contents = slots.map(s => getImgAtSlot(s));
  const [moved] = contents.splice(srcIdx, 1);
  contents.splice(dstIdx, 0, moved);
  contents.forEach((img, i) => {
    if (!img) return;
    img.pageIndex = slots[i].pageIndex;
    img.cellIndex = slots[i].cellIndex;
    img.split = slots[i].split;
  });
  renderImgSheetPages();
}

function renderSplitCellHtml(p, ci, splitType) {
  const isH = splitType === 'horizontal';
  const part1 = isH ? 'top' : 'left';
  const part2 = isH ? 'bottom' : 'right';
  const label1 = isH ? '상하' : '좌우';
  const img1 = imageSheet.images.find(im => im.pageIndex===p && im.cellIndex===ci && im.split===part1);
  const img2 = imageSheet.images.find(im => im.pageIndex===p && im.cellIndex===ci && im.split===part2);
  const capPos = imageSheet.captionPosition;
  function slotHtml(img, splitPos) {
    const slotKey = `${p}-${ci}-${splitPos}`;
    if (!img) {
      return `<div class="is-split-slot is-empty-slot" data-slot-key="${slotKey}"
        onclick="emptySplitSlotClick(event,${p},${ci},'${splitPos}')"
        ondragover="imgDragOver(event)" ondrop="imgDropSplit(event,${p},${ci},'${splitPos}')">
        <div style="font-size:22px;color:#b0c8e8;font-weight:300;pointer-events:none">+</div>
        <div style="font-size:9px;color:#b0c8e8;pointer-events:none;margin-top:2px">클릭 또는 Ctrl+V</div></div>`;
    } else if (img.uploading) {
      return `<div class="is-split-slot" data-slot-key="${slotKey}"><div class="is-uploading" style="height:100%"><span>업로드 중...</span></div></div>`;
    } else if (img.error) {
      return `<div class="is-split-slot" data-slot-key="${slotKey}"><div class="is-error" style="height:100%">${img.error}<br><button onclick="deleteImgFile('${img.id}')" class="btn btn-danger btn-sm">삭제</button></div></div>`;
    } else {
      const cap = img.caption ? `<div class="is-split-cap">${esc(img.caption)}</div>` : '';
      return `<div class="is-split-slot" data-slot-key="${slotKey}" draggable="true"
        onclick="imgSplitSlotClick(event,${p},${ci},'${splitPos}')"
        ondragstart="imgDragStartSplit(event,${p},${ci},'${splitPos}')" ondragover="imgDragOver(event)"
        ondrop="imgDropSplit(event,${p},${ci},'${splitPos}')" ondragend="imgDragEnd()">
        ${capPos==='top' ? cap : ''}
        <div class="is-split-img-wrap"><img src="${img.url}" alt="${esc(img.caption||'')}">
          <button class="is-del-btn" onclick="deleteImgFile('${img.id}')">✕</button></div>
        ${capPos==='bottom' ? cap : ''}</div>`;
    }
  }
  const dir = isH ? 'column' : 'row';
  const divCls = isH ? 'is-split-div-h' : 'is-split-div-v';
  return `<div class="is-cell is-cell-split" style="display:flex;flex-direction:${dir};position:relative;overflow:hidden">
    ${slotHtml(img1, part1)}
    <div class="${divCls}"></div>
    ${slotHtml(img2, part2)}
    <button class="is-merge-btn" onclick="mergeCell(${p},${ci})">${label1} 합치기</button>
  </div>`;
}

function renderImgSheetPages() {
  const container = document.getElementById('imgsheet-pages');
  if (!container) return;
  migrateImgSheet(imageSheet);
  const countEl = document.getElementById('is-count');
  const validCnt = imageSheet.images.filter(i => !i.uploading && !i.error && i.url).length;
  if (countEl) countEl.textContent = `${validCnt} / 50장`;
  const { cols, rows } = IS_LAYOUTS[imageSheet.layout] || IS_LAYOUTS['2x2'];
  const perPage = cols * rows;
  const pageCount = imageSheet.pageCount || 1;
  const insertBtnHtml = (pos) =>
    `<div class="is-insert-row" onclick="insertImgSheetPage(${pos})"><div class="is-insert-line"></div><button class="is-insert-btn">+ 여기에 페이지 추가</button><div class="is-insert-line"></div></div>`;
  let html = insertBtnHtml(0);
  for (let p = 0; p < pageCount; p++) {
    let cells = '';
    for (let ci = 0; ci < perPage; ci++) {
      const key = `${p}-${ci}`;
      const splitType = (imageSheet.cellSplits || {})[key];
      if (splitType) {
        cells += renderSplitCellHtml(p, ci, splitType);
      } else {
        const img = getImgAtCell(p, ci);
        const splitBtns = `<div class="is-split-btns">
          <button class="is-split-btn" onclick="event.stopPropagation();splitCell(${p},${ci},'horizontal')" title="상/하 분할">⊟ 상하</button>
          <button class="is-split-btn" onclick="event.stopPropagation();splitCell(${p},${ci},'vertical')" title="좌/우 분할">⊞ 좌우</button>
        </div>`;
        if (!img) {
          cells += `<div class="is-cell is-empty-cell" data-cell-key="${p}-${ci}"
            onclick="emptyCellClick(event,${p},${ci})"
            ondragover="imgDragOver(event)" ondrop="imgDrop(event,${p},${ci})">
            <div class="is-add-hint"><span class="is-add-hint-icon">+</span><span class="is-add-hint-text">클릭 또는 Ctrl+V</span></div>
            ${splitBtns}</div>`;
        } else if (img.uploading) {
          cells += `<div class="is-cell" data-cell-key="${p}-${ci}"><div class="is-uploading"><span>업로드 중...</span></div></div>`;
        } else if (img.error) {
          cells += `<div class="is-cell" data-cell-key="${p}-${ci}"><div class="is-error">${img.error}<br><button onclick="deleteImgFile('${img.id}')" class="btn btn-danger btn-sm" style="margin-top:4px">삭제</button></div></div>`;
        } else {
          const capHtml = `<div class="is-caption ${imageSheet.captionPosition==='top'?'is-caption-top':'is-caption-bot'}"><input type="text" class="is-caption-input" value="${esc(img.caption||'')}" placeholder="캡션 입력" onchange="updateImgCaption('${img.id}',this.value)"></div>`;
          cells += `<div class="is-cell" data-cell-key="${p}-${ci}" draggable="true"
            onclick="imgCellClick(event,${p},${ci})"
            ondragstart="imgDragStart(event,${p},${ci})" ondragover="imgDragOver(event)"
            ondrop="imgDrop(event,${p},${ci})" ondragend="imgDragEnd()">
            ${imageSheet.captionPosition==='top' ? capHtml : ''}
            <div class="is-img-wrap"><img src="${img.url}" alt="${esc(img.caption||'')}">
              <button class="is-del-btn" onclick="deleteImgFile('${img.id}')">✕</button></div>
            ${imageSheet.captionPosition==='bottom' ? capHtml : ''}</div>`;
        }
      }
    }
    html += `<div class="is-page">
      <div class="is-page-num">페이지 ${p+1} / ${pageCount}
        <button onclick="deleteImgSheetPage(${p})" class="btn btn-danger btn-sm" style="padding:1px 7px;margin-left:8px;font-size:10px">페이지 삭제</button>
      </div>
      <div class="is-grid" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">${cells}</div>
    </div>`;
    html += insertBtnHtml(p + 1);
  }
  container.innerHTML = html;
  // 렌더 후 활성 셀 강조 복원
  if (activeCell) {
    const { pageIndex: ap, cellIndex: ac, split: asp } = activeCell;
    const el = asp
      ? container.querySelector(`[data-slot-key="${ap}-${ac}-${asp}"]`)
      : container.querySelector(`[data-cell-key="${ap}-${ac}"]`);
    if (el) el.classList.add('is-cell-active');
  }
}

// Ctrl+V 이미지 붙여넣기 (활성 셀 우선)
document.addEventListener('paste', async function(e) {
  const sec = document.getElementById('imgsheet-section');
  if (!sec || !sec.classList.contains('open')) return;
  if (document.activeElement?.classList.contains('is-caption-input')) return;
  const items = e.clipboardData?.items;
  if (!items) return;
  const files = [];
  for (const item of items) {
    if (item.kind === 'file' && item.type.startsWith('image/')) { const f = item.getAsFile(); if (f) files.push(f); }
  }
  if (!files.length) return;
  e.preventDefault();
  if (activeCell) {
    const { pageIndex: ap, cellIndex: ac, split: asp } = activeCell;
    const existImg = asp ? getImgAtSubCell(ap, ac, asp) : getImgAtCell(ap, ac);
    if (existImg) {
      if (!confirm('현재 셀의 이미지를 교체하시겠습니까?')) return;
      await deleteImgFile(existImg.id);
    }
    clearActiveCell();
    await handleImgSheetFiles(files, ap, ac, asp);
  } else {
    handleImgSheetFiles(files);
  }
});

// 이미지 시트 영역 밖 클릭 → 활성 셀 해제
document.addEventListener('click', function(e) {
  if (!activeCell) return;
  const sec = document.getElementById('imgsheet-section');
  if (sec && !sec.contains(e.target)) clearActiveCell();
});

// ESC → 활성 셀 해제
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && activeCell) clearActiveCell();
});

async function fetchImgBase64(url) {
  try {
    const res = await fetch(url);
    const blob = await res.blob();
    return await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  } catch(e) { console.warn('이미지 fetch 실패:', url, e); return null; }
}

function getImgNaturalSize(b64, ext) {
  return new Promise(resolve => {
    const el = new Image();
    el.onload  = () => resolve({ natW: el.naturalWidth,  natH: el.naturalHeight });
    el.onerror = () => resolve({ natW: 1, natH: 1 });
    const mime = ext === 'png' ? 'png' : ext === 'gif' ? 'gif' : 'jpeg';
    el.src = `data:image/${mime};base64,${b64}`;
  });
}

async function deleteAllImgSheetFiles(quoteId) {
  if (!window.fbStorage || !window.fbStorageFS?.listAll) return;
  try {
    const { ref: sRef, listAll, deleteObject } = window.fbStorageFS;
    const folderRef = sRef(window.fbStorage, `quotes/${quoteId}/imagesheet`);
    const result = await listAll(folderRef);
    if (result.items.length) await Promise.all(result.items.map(r => deleteObject(r)));
  } catch(e) { console.warn('Storage 일괄 삭제 오류:', e); }
}

function syncImgSheetUI() {
  const sel = document.getElementById('is-layout-sel');
  if (sel) sel.value = imageSheet.layout;
  const radios = document.querySelectorAll('input[name="is-cap-pos"]');
  radios.forEach(r => { r.checked = (r.value === imageSheet.captionPosition); });
  const nameInp = document.getElementById('is-sheet-name');
  if (nameInp) nameInp.value = imageSheet.sheetName || '이미지 시트';
}

function clearQuote() {
  if (!confirm('견적 내역을 초기화하시겠습니까?')) return;
  quoteGroups=[]; ungroupedItems=[]; activeGroupId=null; editingQuoteId=null;
  imageSheet = { layout: '2x2', captionPosition: 'top', sheetName: '이미지 시트', pageCount: 1, images: [], cellSplits: {} };
  document.getElementById('inp-client').value  = '';
  document.getElementById('inp-project').value = '';
  document.getElementById('inp-date').value    = today();
  document.getElementById('inp-note').value    = DEFAULT_NOTE;
  renderQuoteTable();
  renderImgSheetPages();
}

// ===== 그룹 관리 (v2) =====
function newGroupId() { return 'g' + Date.now() + Math.random().toString(36).slice(2,5); }

function addGroup() {
  const id = newGroupId();
  quoteGroups.push({ id, name: '새 그룹', subLabel: '', showSubtotal: false, items: [] });
  activeGroupId = id;
  renderQuoteTable();
  setTimeout(() => {
    const el = document.querySelector(`[data-group-id="${id}"] .group-name-input`);
    if (el) el.select();
  }, 30);
}

function deleteGroup(id) {
  const grp = quoteGroups.find(g=>g.id===id);
  if (!confirm(`그룹 "${grp?.name||''}"을 삭제하시겠습니까?\n포함된 ${grp?.items?.length||0}개 항목도 함께 삭제됩니다.`)) return;
  quoteGroups = quoteGroups.filter(g=>g.id!==id);
  if (activeGroupId===id) activeGroupId = quoteGroups.length ? quoteGroups[0].id : null;
  renderQuoteTable();
}

function moveGroup(id, dir) {
  const idx = quoteGroups.findIndex(g=>g.id===id);
  const newIdx = idx + dir;
  if (idx<0||newIdx<0||newIdx>=quoteGroups.length) return;
  [quoteGroups[idx],quoteGroups[newIdx]] = [quoteGroups[newIdx],quoteGroups[idx]];
  renderQuoteTable();
}

// 그룹 내 항목을 위/아래 화살표로 한 칸 이동
function moveGroupItem(gid, i, dir) {
  const items = gid === '__ungrouped__' ? ungroupedItems : (quoteGroups.find(g=>g.id===gid)||{items:[]}).items;
  const newIdx = i + dir;
  if (newIdx < 0 || newIdx >= items.length) return;
  [items[i], items[newIdx]] = [items[newIdx], items[i]];
  renderQuoteTable();
}

// ===== SortableJS: 드래그 앤 드롭 순서 변경 =====
let _groupSortable = null;
const _itemSortables = [];

function _getItemsArray(gid) {
  if (gid === '__ungrouped__') return ungroupedItems;
  const g = quoteGroups.find(x => x.id === gid);
  return g ? g.items : null;
}

function initSortables() {
  if (typeof Sortable === 'undefined') return;
  // 기존 Sortable 인스턴스 정리
  if (_groupSortable) { try { _groupSortable.destroy(); } catch(e){} _groupSortable = null; }
  _itemSortables.forEach(s => { try { s.destroy(); } catch(e){} });
  _itemSortables.length = 0;

  // 그룹 카드 자체 드래그
  const container = document.getElementById('groups-container');
  if (container) {
    _groupSortable = Sortable.create(container, {
      animation: 150,
      handle: '.group-drag-handle',
      draggable: '.group-card',
      ghostClass: 'sortable-ghost',
      chosenClass: 'sortable-chosen',
      dragClass: 'sortable-drag',
      onEnd: (evt) => {
        if (evt.oldIndex === evt.newIndex) return;
        const [moved] = quoteGroups.splice(evt.oldIndex, 1);
        quoteGroups.splice(evt.newIndex, 0, moved);
        renderQuoteTable();
      }
    });
  }

  // 각 그룹 내 항목(+ 미그룹 항목) 드래그 — group 옵션으로 그룹 간 이동 허용
  document.querySelectorAll('tbody.group-items-tbody').forEach(tbody => {
    const inst = Sortable.create(tbody, {
      animation: 150,
      handle: '.item-drag-handle',
      draggable: 'tr[data-item-idx]',
      filter: 'tr[data-empty]',
      group: 'quote-items',
      ghostClass: 'sortable-ghost',
      chosenClass: 'sortable-chosen',
      dragClass: 'sortable-drag',
      onEnd: (evt) => {
        const fromGid = evt.from.getAttribute('data-group-id');
        const toGid   = evt.to.getAttribute('data-group-id');
        const fromArr = _getItemsArray(fromGid);
        const toArr   = _getItemsArray(toGid);
        if (!fromArr || !toArr) { renderQuoteTable(); return; }
        if (fromGid === toGid && evt.oldIndex === evt.newIndex) return;
        const [moved] = fromArr.splice(evt.oldIndex, 1);
        if (moved === undefined) { renderQuoteTable(); return; }
        toArr.splice(evt.newIndex, 0, moved);
        renderQuoteTable();
      }
    });
    _itemSortables.push(inst);
  });
}

function setActiveGroup(id) {
  if (activeGroupId===id) return;
  activeGroupId = id;
  renderQuoteTable();
}

function updateGroup(id, field, val) {
  const grp = quoteGroups.find(g=>g.id===id);
  if (!grp) return;
  grp[field] = val;
  if (field==='showSubtotal') renderQuoteTable();
}

function getAllItems() {
  // TODO: 2차 작업에서 그룹별 엑셀/PDF 출력 구현 예정. 현재는 전체 항목 순차 나열.
  const result = [];
  quoteGroups.forEach(g => result.push(...g.items));
  result.push(...ungroupedItems);
  return result;
}

function toggleExpenseForm() {
  const form = document.getElementById('expense-form');
  const btn  = document.getElementById('expense-toggle-btn');
  const open = form.classList.toggle('open');
  btn.textContent = open ? '✕ 실비 입력 닫기' : '＋ 실비 항목 직접 입력';
}

function addExpenseItem() {
  const name = document.getElementById('e-name').value.trim();
  if (!name) { alert('품명을 입력하세요.'); return; }
  const qty   = parseFloat(document.getElementById('e-qty').value)   || 1;
  const unit  = document.getElementById('e-unit').value.trim()       || '건';
  const price = parseFloat(document.getElementById('e-price').value) || 0;
  const note  = document.getElementById('e-note').value.trim();
  const newItem = { name, unit, qty, price, note, isExpense: true };
  const grp = activeGroupId ? quoteGroups.find(g=>g.id===activeGroupId) : null;
  if (grp) grp.items.push(newItem);
  else ungroupedItems.push(newItem);
  document.getElementById('e-name').value  = '';
  document.getElementById('e-price').value = '';
  document.getElementById('e-qty').value   = 1;
  document.getElementById('e-note').value  = '(실비)';
  renderQuoteTable();
}

async function saveQuote() {
  const client = document.getElementById('inp-client').value.trim();
  if (!client) { alert('수신처를 입력하세요.'); return; }
  const allItems = getAllItems();
  if (!allItems.length) { alert('견적 항목이 없습니다.'); return; }
  const sup = allItems.reduce((s,it)=>s+it.qty*it.price, 0);
  const tax = allItems.reduce((s,it)=>s+Math.round(it.qty*it.price*0.1), 0);
  const newId = editingQuoteId || Date.now().toString();
  // 이미지 시트: 저장 가능한 데이터만 추출 (uploading/error 제외)
  const savedImages = imageSheet.images
    .filter(im => !im.uploading && !im.error && im.url)
    .map(im => ({ id: im.id, url: im.url, caption: im.caption||'', storagePath: im.storagePath||'', pageIndex: im.pageIndex||0, cellIndex: im.cellIndex||0, split: im.split||null }));
  // 기존 견적 수정 시 notProceeded 상태 보존
  const prevEntry = editingQuoteId ? quoteHistory.find(h => h.id === editingQuoteId) : null;
  const email = currentUserEmail();
  const entry = {
    id:      newId,
    client,  project: document.getElementById('inp-project').value.trim(),
    date:    document.getElementById('inp-date').value,
    note:    document.getElementById('inp-note').value,
    version: 3,
    groups:  clone(quoteGroups),
    ungroupedItems: clone(ungroupedItems),
    imageSheet: { layout: imageSheet.layout, captionPosition: imageSheet.captionPosition, sheetName: imageSheet.sheetName||'이미지 시트', pageCount: imageSheet.pageCount||1, images: savedImages, cellSplits: imageSheet.cellSplits || {} },
    supply: sup, tax, total: sup+tax,
    notProceeded: prevEntry ? !!prevEntry.notProceeded : false,
    createdBy: prevEntry ? (prevEntry.createdBy || '') : email,
    updatedBy: email,
    savedAt: new Date().toISOString()
  };
  setSyncStatus('syncing');
  try {
    await fsCollection('quotes').doc(entry.id).set(entry);
    editingQuoteId = newId;
    // 로컬 캐시 업데이트
    const hist = loadHistoryLS();
    const idx  = hist.findIndex(h=>h.id===entry.id);
    if (idx>=0) hist[idx]=entry; else hist.unshift(entry);
    saveHistoryLS(hist);
    setSyncStatus('ok');
    alert('견적이 저장되었습니다.');
  } catch(e) {
    console.error('Save quote error:', e);
    // 오프라인 시 로컬에만 저장
    const hist = loadHistoryLS();
    const idx  = hist.findIndex(h=>h.id===entry.id);
    if (idx>=0) hist[idx]=entry; else hist.unshift(entry);
    saveHistoryLS(hist);
    quoteHistory = loadHistoryLS();
    editingQuoteId = entry.id;
    setSyncStatus('error', '오프라인 저장');
    alert('견적이 저장되었습니다. (오프라인 모드)');
  }
  updateCopyQuoteBtnVisibility();
}

  const HDR  = ['No.','품명','수량','공급단가','공급가액','세액','비고'];

    const c = cell(`${col}${R}`);
    c.value     = HDR[i];
    c.font      = font('맑은 고딕', 10, true, 'FF1A3A5C');

    c.fill      = fill('FFE8EDF5');

      top:   bdr('medium','FF1A3A5C'),
      left:  bdr('thin','FF8899BB'),
      bottom:bdr('medium','FF1A3A5C'),
      right: bdr('thin','FF8899BB')
    };
  });
  R++;

  // ━━━ 8. 항목 rows (그룹 구조 반영) ━━━
  const thinBorder = allBorder('thin','FFCCCCCC');
  const writeItemRow = (it, no) => {
    const s = it.qty*it.price, t = Math.round(s*0.1);
    const vals = [no, it.name, `${it.qty}${it.unit}`, it.price, s, t, it.note||''];

    ws.getRow(R).height = 15;
    merge(`A${R}:G${R}`);
    const lc = cell(`A${R}`);
    lc.value  = txt;
    lc.font   = font('맑은 고딕', 9, false, 'FF666666');
    lc.fill   = fill('FFF5F5F5');
    lc.border = allBorder('thin','FFDDDDDD');
    R++;
  });

  // ━━━ 이미지 시트 워크시트 ━━━
  const xlsImgs = imageSheet.images.filter(im => !im.uploading && !im.error && im.url);
  if (xlsImgs.length > 0) {
    const { cols: iCols, rows: iRows } = IS_LAYOUTS[imageSheet.layout] || IS_LAYOUTS['2x2'];
    const perPage = iCols * iRows;
    const wsI = wb.addWorksheet(sanitizeSheetName(imageSheet.sheetName || '이미지 시트'));
    // A4 여백 포함 실사용 폭 ≈ 643px → 각 열 너비(chars, 1ch ≈ 7px)
    const iColW = Math.max(10, Math.round(92 / iCols));
    for (let c = 1; c <= iCols; c++) wsI.getColumn(c).width = iColW;
    const capRowH = 28;
    const marRowH = 6;
    const totalPages = imageSheet.pageCount || Math.ceil(xlsImgs.length / perPage) || 1;
    // 이미지 배치 상수 (하드코딩 — 변환 오차 원천 차단)
    const CELL_W_PX = 345;   // 46 * 7.5
    const CELL_H_PX = 533;   // 400pt * 4/3
    const MAX_IMG_W = 300;   // 이미지 최대 폭 (px)
    const MAX_IMG_H = 400;   // 이미지 최대 높이 (px)

    // 이미지 원본 크기 사전 로드 (URL 기반, 브라우저 캐시 활용)
    const imgSizeCache = {};
    await Promise.all(xlsImgs.map(img =>
      new Promise(resolve => {
        const el = new Image();
        el.onload  = () => { imgSizeCache[img.id] = { natW: el.naturalWidth, natH: el.naturalHeight }; resolve(); };
        el.onerror = () => { imgSizeCache[img.id] = null; resolve(); };
        el.src = img.url;
      })
    ));

    let iRow = 1;

    const isCapTop = (imageSheet.captionPosition || 'bottom') === 'top';
    // 각 그리드 행마다 (캡션+여백+이미지+여백) 또는 (이미지+여백+캡션+여백) 4행씩 사용
    const bandRows  = 4;
    const imgRowOf  = (startRow, gr) => isCapTop ? startRow + gr * bandRows + 2 : startRow + gr * bandRows;
    const capRowOf  = (startRow, gr) => isCapTop ? startRow + gr * bandRows     : startRow + gr * bandRows + 2;
    const mar1RowOf = (startRow, gr) => startRow + gr * bandRows + 1;
    const mar2RowOf = (startRow, gr) => startRow + gr * bandRows + 3;

    for (let p = 0; p < totalPages; p++) {
      const imgStartRow = iRow;

      // 병렬 fetch + 자연 크기 측정 (split 셀 포함)
      const fetchTasks = [];
      for (let ci = 0; ci < perPage; ci++) {
        const gr = Math.floor(ci / iCols);
        const gc = ci % iCols;
        const imgExcelRow = imgRowOf(imgStartRow, gr);
        const capExcelRow = capRowOf(imgStartRow, gr);
        const sKey = `${p}-${ci}`;
        const splitType = (imageSheet.cellSplits || {})[sKey];
        const candidates = splitType
          ? [
              { img: xlsImgs.find(im => im.pageIndex===p && im.cellIndex===ci && im.split===(splitType==='horizontal'?'top':'left')),   splitPos: splitType==='horizontal'?'top':'left'   },
              { img: xlsImgs.find(im => im.pageIndex===p && im.cellIndex===ci && im.split===(splitType==='horizontal'?'bottom':'right')), splitPos: splitType==='horizontal'?'bottom':'right' }
            ]
          : [{ img: xlsImgs.find(im => im.pageIndex===p && im.cellIndex===ci && !im.split), splitPos: null }];
        for (const { img, splitPos } of candidates) {
          if (!img) continue;
          fetchTasks.push(
            fetchImgBase64(img.url).then(async b64 => {
              if (!b64) return { b64: null, img, gr, gc, imgExcelRow, capExcelRow, ext: 'jpeg', natW: 1, natH: 1, splitType, splitPos };
              let ext = 'jpeg';
              if ((img.storagePath||'').match(/\.png$/i) || img.url.includes('png')) ext = 'png';
              else if ((img.storagePath||'').match(/\.gif$/i)) ext = 'gif';
              const size = await getImgNaturalSize(b64, ext);
              return { b64, img, gr, gc, imgExcelRow, capExcelRow, ext, ...size, splitType, splitPos };
            })
          );
        }
      }
      const fetched = await Promise.all(fetchTasks);

      // 행 높이 설정 + 캡션 행 배경 초기화
      for (let gr = 0; gr < iRows; gr++) {
        wsI.getRow(imgRowOf(imgStartRow, gr)).height  = 400;
        wsI.getRow(capRowOf(imgStartRow, gr)).height  = capRowH;
        wsI.getRow(mar1RowOf(imgStartRow, gr)).height = marRowH;
        wsI.getRow(mar2RowOf(imgStartRow, gr)).height = marRowH;
        for (let gc = 0; gc < iCols; gc++) {
          const cc = wsI.getCell(capRowOf(imgStartRow, gr), gc + 1);
          cc.fill      = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF5F5F5' } };
          cc.alignment = { horizontal: 'center', vertical: 'middle' };
          cc.font      = { name: '맑은 고딕', size: 9, color: { argb: 'FF555555' } };
          cc.border    = allBorder('thin', 'FFEEEEEE');
        }
      }

      for (const { b64, img, gr, gc, imgExcelRow, capExcelRow, ext, natW: rawNatW, natH: rawNatH, splitType, splitPos } of fetched) {
        if (!b64) continue;
        // imgSizeCache(URL 기반) 우선, 폴백은 base64 측정값
        const sz = imgSizeCache[img.id];
        const natW = (sz && sz.natW > 1) ? sz.natW : (rawNatW > 1 ? rawNatW : 1);
        const natH = (sz && sz.natH > 1) ? sz.natH : (rawNatH > 1 ? rawNatH : 1);
        const imgId = wb.addImage({ base64: b64, extension: ext });

        // 분할 셀: 최대 크기 및 sub-area 시작 위치
        let maxW = MAX_IMG_W, maxH = MAX_IMG_H;
        let offXpx = 0, offYpx = 0;
        if (splitType === 'horizontal') {
          maxH = MAX_IMG_H / 2;
          if (splitPos === 'bottom') offYpx = CELL_H_PX / 2;
        } else if (splitType === 'vertical') {
          maxW = MAX_IMG_W / 2;
          if (splitPos === 'right') offXpx = CELL_W_PX / 2;
        }

        // contain-fit: 원본 비율 유지, MAX 안에 맞추기
        const imgRatio = natW / natH, maxRatio = maxW / maxH;
        let finalW, finalH;
        if (imgRatio > maxRatio) { finalW = maxW; finalH = maxW / imgRatio; }
        else                      { finalH = maxH; finalW = maxH * imgRatio; }

        // 좌상단 정렬 (sub-area 시작 위치만 반영)
        const tlCol = gc + offXpx / CELL_W_PX;
        const tlRow = (imgExcelRow - 1) + offYpx / CELL_H_PX;

        console.log(`[이미지시트] ${img.id}: 원본${natW}x${natH} ar:${(natW/natH).toFixed(3)}`);
        console.log(`  이미지 크기: ${Math.round(finalW)}x${Math.round(finalH)}px`);
        console.log(`  위치: col=${tlCol}, row=${tlRow} (좌상단 정렬)`);

        wsI.addImage(imgId, {
          tl: { col: tlCol, row: tlRow },
          ext: { width: Math.round(finalW), height: Math.round(finalH) },
          editAs: 'oneCell'
        });

        // 캡션 (분할 셀은 첫 번째 sub-slot 캡션 우선)
        if (img.caption) {
          const cc = wsI.getCell(capExcelRow, gc + 1);
          cc.value = img.caption;
        }
      }
      // 페이지당 bandRows*iRows 행 + 1행 구분선
      iRow = imgStartRow + iRows * bandRows + 1;
    }
  }

  // ━━━ 다운로드 ━━━
  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `견적서_${client}_${date}.xlsx`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function buildImgSheetPrintPages() {
  const validImgs = imageSheet.images.filter(im => !im.uploading && !im.error && im.url);
  if (!validImgs.length) return '';
  const { cols, rows } = IS_LAYOUTS[imageSheet.layout] || IS_LAYOUTS['2x2'];
  const perPage = cols * rows;
  const pageCount = imageSheet.pageCount || Math.ceil(validImgs.length / perPage) || 1;
  const capPos = imageSheet.captionPosition;
  const capStyle = 'font-size:8pt;color:#555;padding:2px 4px;text-align:center;flex-shrink:0';
  function imgSlot(img, extraStyle) {
    if (!img) return `<div style="flex:1;border:1px solid #ddd;background:#f5f5f5${extraStyle||''}"></div>`;
    const capTop = capPos==='top' && img.caption ? `<div style="${capStyle};border-bottom:1px solid #eee">${esc(img.caption)}</div>` : '';
    const capBot = capPos==='bottom' && img.caption ? `<div style="${capStyle};border-top:1px solid #eee">${esc(img.caption)}</div>` : '';
    return `<div style="flex:1;display:flex;flex-direction:column;overflow:hidden;border:1px solid #ccc${extraStyle||''}">
      ${capTop}<div style="flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff">
        <img src="${img.url}" style="max-width:100%;max-height:100%;object-fit:contain">
      </div>${capBot}</div>`;
  }
  let html = '';
  for (let p = 0; p < pageCount; p++) {
    let cells = '';
    for (let i = 0; i < perPage; i++) {
      const sKey = `${p}-${i}`;
      const splitType = (imageSheet.cellSplits || {})[sKey];
      if (splitType) {
        const isH = splitType === 'horizontal';
        const part1 = isH ? 'top' : 'left';
        const part2 = isH ? 'bottom' : 'right';
        const img1 = validImgs.find(im => im.pageIndex===p && im.cellIndex===i && im.split===part1);
        const img2 = validImgs.find(im => im.pageIndex===p && im.cellIndex===i && im.split===part2);
        cells += `<div style="display:flex;flex-direction:${isH?'column':'row'};overflow:hidden;border:1px solid #ccc">
          ${imgSlot(img1,';border:none')}
          <div style="${isH?'height:1px;width:100%':'width:1px;height:100%'};background:#ccc;flex-shrink:0"></div>
          ${imgSlot(img2,';border:none')}</div>`;
      } else {
        const img = validImgs.find(im => im.pageIndex===p && im.cellIndex===i && !im.split);
        cells += imgSlot(img);
      }
    }
    html += `<div class="imgsheet-print-page" style="page-break-before:always;width:100%;height:100vh;box-sizing:border-box;padding:16px;font-family:'맑은 고딕','Malgun Gothic',sans-serif">
      <div style="display:grid;width:100%;height:100%;grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr);gap:8px">${cells}</div>
    </div>`;
  }
  return html;
}

// ===== 탭2: 단가표 관리 =====
// 카테고리 → HTML id. 카테고리 키는 공백이 없는 식별자이므로 그대로 사용.
function _catAnchorId(cat) { return 'cat-section-' + cat; }

function renderPriceTab() {
  document.getElementById('price-container').innerHTML =
    Object.keys(priceData).map(cat => buildCatCard(cat)).join('');
  renderPriceSidebar();
  setupPriceCategoryObserver();
}

function renderPriceSidebar() {
  const nav = document.getElementById('price-sidebar-nav');
  if (!nav) return;
  const cats = Object.keys(priceData);
  if (!cats.length) { nav.innerHTML = '<div style="padding:10px;color:#aaa;font-size:11px">카테고리 없음</div>'; return; }
  nav.innerHTML = cats.map(cat => {
    const label = cat.replace(/_/g,' ');
    return `<button class="cat-link" data-cat="${esc(cat)}" onclick="scrollToCategory('${esc(cat)}')">${esc(label)}</button>`;
  }).join('');
}

function scrollToCategory(cat) {
  const el = document.getElementById(_catAnchorId(cat));
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  _setActiveSidebarCat(cat);
}

function _setActiveSidebarCat(cat) {
  const nav = document.getElementById('price-sidebar-nav');
  if (!nav) return;
  nav.querySelectorAll('.cat-link').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.cat === cat);
  });
  // 활성 버튼이 사이드바 바깥에 있으면 사이드바 내에서만 스크롤
  const active = nav.querySelector('.cat-link.active');
  if (active) {
    const navRect = nav.getBoundingClientRect();
    const actRect = active.getBoundingClientRect();
    if (actRect.top < navRect.top || actRect.bottom > navRect.bottom) {
      active.scrollIntoView({ block: 'nearest' });
    }
  }
}

let _priceCatObserver = null;
function setupPriceCategoryObserver() {
  const root = document.getElementById('price-main');
  if (!root) return;
  if (_priceCatObserver) { _priceCatObserver.disconnect(); _priceCatObserver = null; }
  if (typeof IntersectionObserver === 'undefined') return;
  const cards = root.querySelectorAll('.cat-card[data-cat]');
  if (!cards.length) return;
  _priceCatObserver = new IntersectionObserver((entries) => {
    // 가장 위에 보이는 카드를 활성화
    const visible = entries.filter(e => e.isIntersecting)
      .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
    if (visible.length) {
      const cat = visible[0].target.dataset.cat;
      if (cat) _setActiveSidebarCat(cat);
    }
  }, {
    root,
    rootMargin: '0px 0px -70% 0px',
    threshold: 0
  });
  cards.forEach(c => _priceCatObserver.observe(c));
  // 초기 활성화: 첫 카테고리
  const firstCat = cards[0] && cards[0].dataset.cat;
  if (firstCat) _setActiveSidebarCat(firstCat);
}

function buildCatCard(cat) {
  const data = priceData[cat] || {description:'',items:[]};
  const rows = (data.items||[]).map((item,i) => `
    <tr>
      <td><input class="editable" value="${esc(item.name)}" onchange="updatePI('${esc(cat)}',${i},'name',this.value)" style="width:100%;min-width:140px"></td>
      <td><input class="editable" value="${esc(item.unit)}" onchange="updatePI('${esc(cat)}',${i},'unit',this.value)" style="width:48px;text-align:center"></td>
      <td><input class="editable" type="number" value="${item.price}" onchange="updatePI('${esc(cat)}',${i},'price',this.value)" style="width:110px;text-align:right"></td>
      <td><input class="editable" value="${esc(item.note||'')}" onchange="updatePI('${esc(cat)}',${i},'note',this.value)" style="width:100%;min-width:100px"></td>
      <td><input class="editable" value="${esc(item.source||'')}" onchange="updatePI('${esc(cat)}',${i},'source',this.value)" style="width:80px"></td>
      <td><button class="btn btn-danger btn-sm" onclick="deletePI('${esc(cat)}',${i})">삭제</button></td>
    </tr>`).join('');
  return `
  <div class="cat-card" id="${_catAnchorId(cat)}" data-cat="${esc(cat)}">
    <div class="cat-card-header">
      <div class="cat-card-title">
        <div class="cat-card-name">${cat.replace(/_/g,' ')}</div>
        <div class="cat-card-desc">${esc(data.description||'')}</div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="renameCategory('${esc(cat)}')">이름 변경</button>
      <button class="btn btn-danger btn-sm" onclick="deleteCategory('${esc(cat)}')">삭제</button>
    </div>
    <table class="price-table">
      <thead><tr><th>품명</th><th>단위</th><th>단가(원)</th><th>비고</th><th>출처</th><th style="width:56px">관리</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr class="add-item-row"><td colspan="6"><button class="btn btn-secondary btn-sm" onclick="addPI('${esc(cat)}')">+ 새 항목 추가</button></td></tr></tfoot>
    </table>
  </div>`;
}

function updatePI(cat, i, field, val) {
  if (!priceData[cat] || !priceData[cat].items[i]) return;
  priceData[cat].items[i][field] = field==='price' ? (parseFloat(val)||0) : val;
  savePriceLS();
  renderCategorySelect(); renderItemList();
  saveCategoryToFS(cat);
}

function deletePI(cat, i) {
  if (!confirm('이 항목을 삭제하시겠습니까?')) return;
  priceData[cat].items.splice(i,1);
  savePriceLS(); renderPriceTab(); renderCategorySelect(); renderItemList();
  saveCategoryToFS(cat);
}

function addPI(cat) {
  priceData[cat].items.push({name:'새 항목',unit:'건',price:0,note:'',source:''});
  savePriceLS(); renderPriceTab(); renderCategorySelect(); renderItemList();
  saveCategoryToFS(cat);
}

function addCategory() {
  const name = prompt('새 카테고리 이름을 입력하세요:');
  if (!name || !name.trim()) return;
  const key = name.trim().replace(/\s+/g,'_');
  if (priceData[key]) { alert('이미 존재하는 카테고리입니다.'); return; }
  priceData[key] = {description:'',items:[]};
  savePriceLS(); renderPriceTab(); renderCategorySelect();
  saveCategoryToFS(key);
}

async function renameCategory(cat) {
  const cur = cat.replace(/_/g,' ');
  const name = prompt('새 이름을 입력하세요:', cur);
  if (!name || !name.trim() || name.trim()===cur) return;
  const newKey = name.trim().replace(/\s+/g,'_');
  if (priceData[newKey]) { alert('이미 존재합니다.'); return; }
  const rebuilt = {};
  Object.keys(priceData).forEach(k => { rebuilt[k===cat ? newKey : k] = priceData[k]; });
  priceData = rebuilt;
  savePriceLS(); renderPriceTab(); renderCategorySelect(); renderItemList();
  // Firestore: 새 문서 생성 + 옛 문서 삭제
  await saveCategoryToFS(newKey);
  await deleteCategoryFromFS(cat);
}

async function deleteCategory(cat) {
  if (!confirm(`카테고리 "${cat.replace(/_/g,' ')}"을 삭제하시겠습니까?\n포함된 모든 항목이 삭제됩니다.`)) return;
  delete priceData[cat];
  savePriceLS(); renderPriceTab(); renderCategorySelect(); renderItemList();
  await deleteCategoryFromFS(cat);
}

function exportPriceExcel() {
  const aoa = [['카테고리','카테고리설명','품명','단위','단가','비고','출처']];
  Object.keys(priceData).forEach(cat => {
    const data = priceData[cat];
    (data.items||[]).forEach(item => {
      aoa.push([cat, data.description||'', item.name, item.unit||'', item.price||0, item.note||'', item.source||'']);
    });
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:22},{wch:32},{wch:42},{wch:8},{wch:12},{wch:32},{wch:16}];
  XLSX.utils.book_append_sheet(wb, ws, '단가표');
  XLSX.writeFile(wb, '단가표.xlsx');
}

function importPriceExcel(e) {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const wb = XLSX.read(ev.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      if (rows.length < 2) { alert('데이터가 없습니다.'); return; }
      // 헤더 행 건너뛰고 파싱: 카테고리, 카테고리설명, 품명, 단위, 단가, 비고, 출처
      const newData = {};
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        const cat  = String(r[0]||'').trim();
        const desc = String(r[1]||'').trim();
        const name = String(r[2]||'').trim();
        const unit = String(r[3]||'').trim();
        const price= parseFloat(r[4])||0;
        const note = String(r[5]||'').trim();
        const src  = String(r[6]||'').trim();
        if (!cat || !name) continue;
        if (!newData[cat]) newData[cat] = {description: desc, items: []};
        newData[cat].items.push({name, unit, price, note, source: src});
      }
      if (!Object.keys(newData).length) { alert('가져올 데이터가 없습니다.'); return; }
      if (!confirm('현재 단가표를 가져온 파일로 교체하시겠습니까?')) return;
      priceData = newData; savePriceLS();
      renderPriceTab(); renderCategorySelect(); renderItemList();
      saveAllPriceToFS().then(() => alert('단가표를 가져왔습니다.'));
    } catch(err) { alert('파일을 읽을 수 없습니다.\n' + err.message); }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}

// ===== 탭3: 견적 이력 =====
const LS_HISTORY_FILTERS = 'belcom_history_filters_v1';
const LS_TAX_FILTER_LEGACY = 'belcom_tax_filter_v1';
// 저장되는 필터: 수신처 / 세금계산서 / 정렬 / 미진행 숨기기 / 진행 상태 (조회 입력값은 저장 안 함)
const DEFAULT_HISTORY_FILTERS = { client: '', tax: 'all', sort: 'date-desc', hideNotProceeded: false, proceed: 'all' };
let historyFilters = { ...DEFAULT_HISTORY_FILTERS };
// 조회 입력(세션 전용): 수신처/프로젝트명 부분 일치 + 날짜 범위
let historySearchClient    = '';
let historySearchProject   = '';
let historySearchStartDate = '';
let historySearchEndDate   = '';

function loadHistoryFilters() {
  try {
    const raw = localStorage.getItem(LS_HISTORY_FILTERS);
    if (raw) {
      const obj = JSON.parse(raw) || {};
      if (typeof obj.client === 'string') historyFilters.client = obj.client;
      if (obj.tax === 'all' || obj.tax === 'issued' || obj.tax === 'unissued') historyFilters.tax = obj.tax;
      if (typeof obj.sort === 'string') historyFilters.sort = obj.sort;
      if (typeof obj.hideNotProceeded === 'boolean') historyFilters.hideNotProceeded = obj.hideNotProceeded;
      if (obj.proceed === 'all' || obj.proceed === 'proceed' || obj.proceed === 'notProceeded') historyFilters.proceed = obj.proceed;
    } else {
      // 구 taxFilter 설정 마이그레이션
      const legacy = localStorage.getItem(LS_TAX_FILTER_LEGACY);
      if (legacy === 'unissued') historyFilters.tax = 'unissued';
    }
  } catch(e) {}
}
function saveHistoryFilters() {
  try { localStorage.setItem(LS_HISTORY_FILTERS, JSON.stringify(historyFilters)); } catch(e) {}
}
// 필터/정렬 즉시 적용 (드롭다운 변경 시)
function setHistoryFilter(key, val) {
  historyFilters[key] = val;
  saveHistoryFilters();
  renderHistory();
}
// '조회' 버튼 / 엔터 키: 수신처+프로젝트명+날짜 범위 모두 수집하여 적용
function applyHistorySearch() {
  const cEl = document.getElementById('hf-search-client');
  const pEl = document.getElementById('hf-search-project');
  historySearchClient  = ((cEl && cEl.value) || '').trim().toLowerCase();
  historySearchProject = ((pEl && pEl.value) || '').trim().toLowerCase();
  if (hfFlatpickr && hfFlatpickr.selectedDates && hfFlatpickr.selectedDates.length) {
    const d = hfFlatpickr.selectedDates;
    if (d.length >= 2) {
      historySearchStartDate = _hfFmt(d[0]);
      historySearchEndDate   = _hfFmt(d[1]);
    } else {
      historySearchStartDate = _hfFmt(d[0]);
      historySearchEndDate   = '';
    }
  } else {
    historySearchStartDate = '';
    historySearchEndDate   = '';
  }
  renderHistory();
}
// 초기화: 조회 입력 + 필터/정렬 모두 리셋
function resetHistoryFilters() {
  historyFilters = { ...DEFAULT_HISTORY_FILTERS };
  historySearchClient = historySearchProject = historySearchStartDate = historySearchEndDate = '';
  const cEl = document.getElementById('hf-search-client');  if (cEl) cEl.value = '';
  const pEl = document.getElementById('hf-search-project'); if (pEl) pEl.value = '';
  const npEl = document.getElementById('hf-hide-np'); if (npEl) npEl.checked = false;
  const prEl = document.getElementById('hf-proceed-select'); if (prEl) prEl.value = 'all';
  if (hfFlatpickr) hfFlatpickr.clear(false);
  saveHistoryFilters();
  renderHistory();
}

// ===== Flatpickr 날짜 범위 선택기 =====
let hfFlatpickr = null;

function _hfFmt(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

function _hfQuickRange(kind) {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (kind === 'yesterday') {
    const d = new Date(today); d.setDate(d.getDate()-1);
    return [_hfFmt(d), _hfFmt(d)];
  }
  if (kind === '7days') {
    const d = new Date(today); d.setDate(d.getDate()-6);
    return [_hfFmt(d), _hfFmt(today)];
  }
  if (kind === '30days') {
    const d = new Date(today); d.setDate(d.getDate()-29);
    return [_hfFmt(d), _hfFmt(today)];
  }
  if (kind === 'thisMonth') {
    const s = new Date(today.getFullYear(), today.getMonth(), 1);
    return [_hfFmt(s), _hfFmt(today)];
  }
  if (kind === 'lastMonth') {
    const s = new Date(today.getFullYear(), today.getMonth()-1, 1);
    const e = new Date(today.getFullYear(), today.getMonth(), 0);
    return [_hfFmt(s), _hfFmt(e)];
  }
  return [null, null];
}

// 캘린더 내부에 삽입할 빠른 선택 바 (월 이동 화살표와 겹치지 않도록 months와 days 사이에 배치)
function _hfInjectQuickBar(inst) {
  const cal = inst.calendarContainer;
  if (!cal || cal.querySelector('.hf-quick-bar')) return;
  const months = cal.querySelector('.flatpickr-months');
  const inner  = cal.querySelector('.flatpickr-innerContainer');
  if (!months || !inner) return;
  const bar = document.createElement('div');
  bar.className = 'hf-quick-bar';
  bar.innerHTML = [
    ['yesterday','어제'],
    ['7days','최근 7일'],
    ['30days','최근 30일'],
    ['thisMonth','이번 달'],
    ['lastMonth','지난 달']
  ].map(([k,l]) => `<button type="button" data-r="${k}">${l}</button>`).join('');
  bar.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-r]');
    if (!btn) return;
    e.preventDefault();
    const [s, en] = _hfQuickRange(btn.dataset.r);
    if (s && en) inst.setDate([s, en], false);
  });
  cal.insertBefore(bar, inner);
}

function initHistoryDatePicker() {
  const inp = document.getElementById('hf-date-range');
  if (!inp) return;
  if (typeof flatpickr === 'undefined') {
    setTimeout(initHistoryDatePicker, 300);
    return;
  }
  if (hfFlatpickr) return;
  const plugins = [];
  if (typeof confirmDatePlugin !== 'undefined') {
    plugins.push(confirmDatePlugin({ confirmText: '적용', showAlways: true, confirmIcon: '' }));
  }
  hfFlatpickr = flatpickr(inp, {
    mode: 'range',
    dateFormat: 'Y-m-d',
    locale: (flatpickr.l10ns && flatpickr.l10ns.ko) ? 'ko' : 'default',
    showMonths: 2,
    allowInput: false,
    clickOpens: true,
    closeOnSelect: false,
    position: 'auto below',
    static: false,
    plugins,
    onReady: function(_sel, _str, inst) {
      if (inst.calendarContainer) inst.calendarContainer.classList.add('belcom-cal');
      _hfInjectQuickBar(inst);
    }
  });
}

function renderClientFilterOptions() {
  const sel = document.getElementById('hf-client-select');
  if (!sel) return;
  const clients = Array.from(new Set(quoteHistory.map(h => (h.client||'').trim()).filter(Boolean)))
    .sort((a,b) => a.localeCompare(b, 'ko'));
  let cur = historyFilters.client || '';
  if (cur && !clients.includes(cur)) { cur = ''; historyFilters.client = ''; saveHistoryFilters(); }
  sel.innerHTML = '<option value="">전체 수신처</option>' +
    clients.map(c => `<option value="${esc(c)}"${c===cur?' selected':''}>${esc(c)}</option>`).join('');
}

function renderHistory() {
  const el = document.getElementById('history-list');
  if (!el) return;
  // Flatpickr 지연 초기화 (히스토리 탭 첫 렌더 시)
  if (!hfFlatpickr) initHistoryDatePicker();
  // 필터 드롭다운 상태 동기화 (조회 입력값은 사용자 입력 유지)
  const taxSel  = document.getElementById('hf-tax-select');
  const sortSel = document.getElementById('hf-sort-select');
  const prSel   = document.getElementById('hf-proceed-select');
  const npCb    = document.getElementById('hf-hide-np');
  if (taxSel)  taxSel.value  = historyFilters.tax;
  if (sortSel) sortSel.value = historyFilters.sort;
  if (prSel)   prSel.value   = historyFilters.proceed;
  if (npCb)    npCb.checked  = !!historyFilters.hideNotProceeded;
  renderClientFilterOptions();

  if (!quoteHistory.length) { el.innerHTML='<div class="empty-msg">저장된 견적이 없습니다.</div>'; return; }

  let list = quoteHistory.slice();

  // 조회 입력: 수신처 부분 일치
  if (historySearchClient) {
    const q = historySearchClient;
    list = list.filter(h => (h.client||'').toLowerCase().includes(q));
  }
  // 조회 입력: 프로젝트명 부분 일치
  if (historySearchProject) {
    const q = historySearchProject;
    list = list.filter(h => (h.project||'').toLowerCase().includes(q));
  }
  // 조회 입력: 날짜 범위 (견적일자 h.date 기준, YYYY-MM-DD 문자열 비교)
  const sd = historySearchStartDate;
  const ed = historySearchEndDate;
  if (sd) list = list.filter(h => (h.date||'') >= sd);
  if (ed) list = list.filter(h => (h.date||'') <= ed);

  // 수신처 필터
  if (historyFilters.client) {
    list = list.filter(h => (h.client||'').trim() === historyFilters.client);
  }

  // 세금계산서 상태 필터
  if (historyFilters.tax === 'issued')   list = list.filter(h =>  !!h.taxInvoiceIssued);
  else if (historyFilters.tax === 'unissued') list = list.filter(h => !h.taxInvoiceIssued);

  // 진행 상태 필터 (드롭다운): 전체 / 진행 / 미진행
  if (historyFilters.proceed === 'proceed')        list = list.filter(h => !h.notProceeded);
  else if (historyFilters.proceed === 'notProceeded') list = list.filter(h => !!h.notProceeded);

  // 미진행 숨기기 (체크박스) — 드롭다운과 AND 조합
  if (historyFilters.hideNotProceeded) list = list.filter(h => !h.notProceeded);

  // 정렬
  const [sortKey, sortDir] = (historyFilters.sort || 'date-desc').split('-');
  const dirMul = sortDir === 'asc' ? 1 : -1;
  list.sort((a, b) => {
    if (sortKey === 'client') {
      return dirMul * (a.client||'').localeCompare(b.client||'', 'ko');
    }
    if (sortKey === 'total') {
      return dirMul * (Number(a.total||0) - Number(b.total||0));
    }
    // date (기본)
    return dirMul * (a.date||'').localeCompare(b.date||'');
  });

  if (!list.length) {
    el.innerHTML = '<div class="empty-msg">검색 결과가 없습니다.</div>';
    return;
  }

  el.innerHTML = list.map(h=>{
    const issued = !!h.taxInvoiceIssued;
    const issuedDate = h.taxInvoiceIssuedDate || '';
    const notProceeded = !!h.notProceeded;
    const rowCls = notProceeded ? 'not-proceeded' : (issued ? 'tax-issued' : 'tax-unissued');
    const statusCls = issued ? 'tax-status-issued' : 'tax-status-unissued';
    const statusTxt = issued ? '발행' : '미발행';
    const npBadge   = notProceeded ? '<span class="np-badge">미진행</span>' : '';
    const npBtnCls  = notProceeded ? 'btn-proceed-restore' : 'btn-not-proceeded';
    const npBtnTxt  = notProceeded ? '진행' : '미진행';
    const npBtnTitle = notProceeded ? '진행 중으로 복원' : '미진행으로 처리';
    return `
    <div class="history-item ${rowCls}" onclick="loadQuote('${h.id}')">
      <div class="history-meta">
        <div class="h-client">${npBadge}${esc(h.client)}</div>
        <div class="h-project">${esc(h.project||'(프로젝트명 없음)')}</div>
        <div class="h-date">${h.date} · 저장: ${(h.savedAt||'').substring(0,10)}</div>
      </div>
      <div class="history-amount">${fmt(h.total)}원</div>
      <div class="history-tax" onclick="event.stopPropagation()">
        <label>
          <input type="checkbox" ${issued?'checked':''} onchange="onTaxInvoiceToggle(event,'${h.id}')">
          <span class="${statusCls}">세금계산서 ${statusTxt}</span>
        </label>
        <input type="date" value="${esc(issuedDate)}" ${issued?'':'disabled'} onchange="onTaxInvoiceDateChange(event,'${h.id}')">
      </div>
      <button class="btn btn-secondary btn-sm" onclick="copyQuote(event,'${h.id}')" title="이 견적을 복사">복사</button>
      <button class="btn btn-sm ${npBtnCls}" onclick="toggleNotProceeded(event,'${h.id}')" title="${npBtnTitle}">${npBtnTxt}</button>
      <button class="btn btn-danger btn-sm" onclick="deleteQuote(event,'${h.id}')">삭제</button>
    </div>`;
  }).join('');
}

async function onTaxInvoiceToggle(e, id) {
  e.stopPropagation();
  const cb = e.target;
  const checked = cb.checked;
  if (!checked) {
    const ok = confirm('세금계산서 발행 체크를 해제하시겠습니까?\n발행일자도 함께 삭제됩니다.');
    if (!ok) { cb.checked = true; return; }
  }
  const payload = checked
    ? { taxInvoiceIssued: true,  taxInvoiceIssuedDate: today() }
    : { taxInvoiceIssued: false, taxInvoiceIssuedDate: null };
  const entry = quoteHistory.find(h => h.id === id);
  if (entry) { entry.taxInvoiceIssued = payload.taxInvoiceIssued; entry.taxInvoiceIssuedDate = payload.taxInvoiceIssuedDate; }
  setSyncStatus('syncing');
  try {
    await fsCollection('quotes').doc(id).update(payload);
    setSyncStatus('ok');
  } catch(err) {
    console.error('Tax invoice update error:', err);
    setSyncStatus('error', '저장 실패');
  }
  // 로컬 캐시 반영
  const hist = loadHistoryLS();
  const idx = hist.findIndex(h => h.id === id);
  if (idx >= 0) { hist[idx].taxInvoiceIssued = payload.taxInvoiceIssued; hist[idx].taxInvoiceIssuedDate = payload.taxInvoiceIssuedDate; saveHistoryLS(hist); }
  renderHistory();
}

async function onTaxInvoiceDateChange(e, id) {
  e.stopPropagation();
  const dateStr = e.target.value;
  if (!dateStr) return;
  const entry = quoteHistory.find(h => h.id === id);
  if (entry) entry.taxInvoiceIssuedDate = dateStr;
  setSyncStatus('syncing');
  try {
    await fsCollection('quotes').doc(id).update({ taxInvoiceIssuedDate: dateStr });
    setSyncStatus('ok');
  } catch(err) {
    console.error('Tax invoice date update error:', err);
    setSyncStatus('error', '저장 실패');
  }
  const hist = loadHistoryLS();
  const idx = hist.findIndex(h => h.id === id);
  if (idx >= 0) { hist[idx].taxInvoiceIssuedDate = dateStr; saveHistoryLS(hist); }
}

// ===== 미진행 처리 =====
async function toggleNotProceeded(e, id) {
  if (e) e.stopPropagation();
  const entry = quoteHistory.find(h => h.id === id);
  if (!entry) return;
  const curr = !!entry.notProceeded;
  const next = !curr;
  const msg = next
    ? '이 견적을 미진행으로 처리하시겠습니까?'
    : '이 견적을 진행 중으로 복원하시겠습니까?';
  if (!confirm(msg)) return;
  entry.notProceeded = next;
  setSyncStatus('syncing');
  try {
    await fsCollection('quotes').doc(id).update({ notProceeded: next });
    setSyncStatus('ok');
  } catch(err) {
    console.error('Not-proceeded update error:', err);
    setSyncStatus('error', '저장 실패');
  }
  // 로컬 캐시 반영
  const hist = loadHistoryLS();
  const idx = hist.findIndex(h => h.id === id);
  if (idx >= 0) { hist[idx].notProceeded = next; saveHistoryLS(hist); }
  renderHistory();
}

// ===== 견적 복사 =====
let pendingCopyId = null;

function copyQuote(e, id) {
  if (e) e.stopPropagation();
  const src = quoteHistory.find(h => h.id === id);
  if (!src) return;
  pendingCopyId = id;
  const target = `${src.client||''} / ${src.project||'(프로젝트명 없음)'}`;
  const info = document.getElementById('copy-modal-target');
  if (info) info.textContent = target;
  const modal = document.getElementById('copy-modal');
  if (modal) modal.classList.add('open');
}

// 견적 작성 탭 상단의 "견적 복사" 버튼 — 현재 열람/수정 중인 견적을 복사
function copyCurrentQuote() {
  if (!editingQuoteId) return;
  copyQuote(null, editingQuoteId);
}

// editingQuoteId 유무에 따라 복사 버튼 표시/숨김
function updateCopyQuoteBtnVisibility() {
  const btn = document.getElementById('btn-copy-current');
  if (!btn) return;
  if (editingQuoteId) btn.classList.add('visible');
  else btn.classList.remove('visible');
}

function _buildCopiedQuote(src) {
  const copy = clone(src);
  const newId = Date.now().toString() + Math.random().toString(36).slice(2,5);
  copy.id = newId;
  copy.project = (src.project || src.client || '') + ' (복사)';
  copy.date = today();
  copy.taxInvoiceIssued = false;
  copy.taxInvoiceIssuedDate = null;
  copy.notProceeded = false;
  const email = currentUserEmail();
  copy.createdBy = email;
  copy.updatedBy = email;
  copy.savedAt = new Date().toISOString();
  // 그룹 ID 재발급 (충돌 방지)
  if (Array.isArray(copy.groups)) {
    copy.groups = copy.groups.map(g => ({ ...g, id: newGroupId() }));
  }
  // 이미지 시트: Firebase Storage 재업로드 없이 URL/storagePath 그대로 참조
  if (copy.imageSheet && Array.isArray(copy.imageSheet.images)) {
    copy.imageSheet.images = copy.imageSheet.images.map(im => ({
      id: 'img_' + Date.now() + Math.random().toString(36).slice(2,6),
      url: im.url,
      caption: im.caption || '',
      storagePath: im.storagePath || '',
      pageIndex: im.pageIndex || 0,
      cellIndex: im.cellIndex || 0,
      split: im.split || null
    }));
  }
  return copy;
}

function confirmCopyQuote(mode) {
  const id = pendingCopyId;
  pendingCopyId = null;
  closeModal('copy-modal');
  const src = quoteHistory.find(h => h.id === id);
  if (!src) return;
  const copied = _buildCopiedQuote(src);
  if (mode === 'save') {
    saveCopiedQuote(copied);
  } else {
    loadCopiedQuoteIntoEditor(copied);
  }
}

async function saveCopiedQuote(entry) {
  setSyncStatus('syncing');
  try {
    await fsCollection('quotes').doc(entry.id).set(entry);
    const hist = loadHistoryLS();
    hist.unshift(entry);
    saveHistoryLS(hist);
    setSyncStatus('ok');
    alert('견적 복사본이 이력에 저장되었습니다.');
  } catch(err) {
    console.error('Copy quote save error:', err);
    const hist = loadHistoryLS();
    hist.unshift(entry);
    saveHistoryLS(hist);
    quoteHistory = loadHistoryLS();
    renderHistory();
    setSyncStatus('error', '오프라인 저장');
    alert('견적 복사본이 저장되었습니다. (오프라인 모드)');
  }
}

function loadCopiedQuoteIntoEditor(copied) {
  document.getElementById('inp-client').value  = copied.client || '';
  document.getElementById('inp-project').value = copied.project || '';
  document.getElementById('inp-date').value    = copied.date || today();
  document.getElementById('inp-note').value    = copied.note || DEFAULT_NOTE;
  quoteGroups    = clone(copied.groups || []);
  ungroupedItems = clone(copied.ungroupedItems || []);
  if (copied.imageSheet) {
    imageSheet = {
      layout: copied.imageSheet.layout || '2x2',
      captionPosition: copied.imageSheet.captionPosition || 'top',
      sheetName: copied.imageSheet.sheetName || '이미지 시트',
      pageCount: copied.imageSheet.pageCount || 1,
      images: clone(copied.imageSheet.images || []),
      cellSplits: clone(copied.imageSheet.cellSplits || {})
    };
    migrateImgSheet(imageSheet);
  } else {
    imageSheet = { layout: '2x2', captionPosition: 'top', sheetName: '이미지 시트', pageCount: 1, images: [], cellSplits: {} };
  }
  activeGroupId  = quoteGroups.length ? quoteGroups[0].id : null;
  // 아직 저장되지 않은 복사본: 새 ID로 저장되도록 editingQuoteId 초기화
  editingQuoteId = null;
  syncImgSheetUI();
  renderQuoteTable();
  renderImgSheetPages();
  goToQuoteTab();
}

function loadQuote(id) {
  const entry = quoteHistory.find(h=>h.id===id);
  if (!entry) return;
  document.getElementById('inp-client').value  = entry.client;
  document.getElementById('inp-project').value = entry.project||'';
  document.getElementById('inp-date').value    = entry.date;
  document.getElementById('inp-note').value    = entry.note || DEFAULT_NOTE;
  if (entry.version >= 2) {
    quoteGroups    = clone(entry.groups || []);
    ungroupedItems = clone(entry.ungroupedItems || []);
  } else {
    // v1 형식: 전체 항목을 "미분류" 그룹으로 자동 변환
    quoteGroups    = [{ id: newGroupId(), name: '미분류', subLabel: '', showSubtotal: false, items: clone(entry.items || []) }];
    ungroupedItems = [];
  }
  // v3: 이미지 시트 복원
  if (entry.version >= 3 && entry.imageSheet) {
    imageSheet = { layout: entry.imageSheet.layout||'2x2', captionPosition: entry.imageSheet.captionPosition||'bottom', sheetName: entry.imageSheet.sheetName||'이미지 시트', pageCount: entry.imageSheet.pageCount||1, images: clone(entry.imageSheet.images||[]), cellSplits: clone(entry.imageSheet.cellSplits || {}) };
    migrateImgSheet(imageSheet); // pageIndex/cellIndex/split 없는 구 데이터 마이그레이션
  } else {
    imageSheet = { layout: '2x2', captionPosition: 'bottom', sheetName: '이미지 시트', pageCount: 1, images: [], cellSplits: {} };
  }
  activeGroupId  = quoteGroups.length ? quoteGroups[0].id : null;
  editingQuoteId = entry.id;
  syncImgSheetUI();
  renderQuoteTable();
  renderImgSheetPages();
  goToQuoteTab();
  updateCopyQuoteBtnVisibility();
}

async function deleteQuote(e, id) {
  e.stopPropagation();
  if (!confirm('이 견적을 삭제하시겠습니까?')) return;
  setSyncStatus('syncing');
  // Storage 이미지 파일 삭제 (v3)
  deleteAllImgSheetFiles(id).catch(() => {});
  try {
    await fsCollection('quotes').doc(id).delete();
    setSyncStatus('ok');
  } catch(err) {
    console.error('Delete quote error:', err);
    setSyncStatus('error', '삭제 실패');
  }
  // 로컬 캐시도 갱신
  saveHistoryLS(loadHistoryLS().filter(h=>h.id!==id));
  if (editingQuoteId===id) { editingQuoteId=null; imageSheet={layout:'2x2',captionPosition:'top',pageCount:1,images:[]}; }
  updateCopyQuoteBtnVisibility();
  // onSnapshot이 자동 재렌더
}

// ===== 키보드 단축키 =====
document.addEventListener('keydown', e => {
  if (document.getElementById('qty-modal').classList.contains('open')) {
    if (e.key==='Enter') addItemToQuote();
    if (e.key==='Escape') closeModal('qty-modal');
  }
});

// ===== 시작: Firebase Auth 상태 변화에 따라 진입/퇴장 분기 =====
let _appInitialized = false;
(async () => {
  await waitForFirebase();
  fbAuthFS.onAuthStateChanged(auth, user => {
    const lock = document.getElementById('lock-screen');
    if (user) {
      // 로그인됨 → 앱 진입
      lock.classList.add('hidden');
      if (!_appInitialized) {
        _appInitialized = true;
        initApp();
      }
    } else {
      // 로그아웃 상태 → 리스너 해제 후 잠금 화면
      if (priceUnsub) { priceUnsub(); priceUnsub = null; }
      if (histUnsub)  { histUnsub();  histUnsub  = null; }
      _appInitialized = false;
      lock.classList.remove('hidden');
      setSyncStatus('idle', '');
      setTimeout(() => {
        const em = document.getElementById('login-email');
        if (em) em.focus();
      }, 50);
    }
  });
})();
</script>
