  import {

  const app = initializeApp(firebaseConfig);
  // 'belcom' named database 사용 ((default) 아님)
  const db = getFirestore(app, "belcom");

  const storage = getStorage(app);
  const auth = getAuth(app);
  // 창/탭 닫으면 로그아웃되도록 세션 지속성 사용
  setPersistence(auth, browserSessionPersistence).catch(e => console.error('[Auth] persistence error:', e));

  // 일반 inline script에서 사용할 수 있도록 window에 노출

  window.fbStorageFS = { ref, uploadBytesResumable, getDownloadURL, deleteObject, listAll };
  window.fbAuthFS = { signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail };
  window.dispatchEvent(new Event('firebase-ready'));
  console.log('[Firebase] 초기화 완료 — database: "belcom"');

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'맑은 고딕','Malgun Gothic',sans-serif;font-size:13px;background:#f0f2f5;color:#222;height:100vh;display:flex;flex-direction:column;overflow:hidden}
/* Header */
.app-header{background:#1a3a5c;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0}
.app-title{font-size:15px;font-weight:700}
.app-subtitle{font-size:11px;opacity:.65;margin-top:2px}
/* Tabs */
.tab-nav{background:#fff;border-bottom:2px solid #dde3ef;display:flex;padding:0 16px;flex-shrink:0}
.tab-btn{padding:9px 22px;border:none;background:none;cursor:pointer;font-size:13px;font-family:inherit;color:#777;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab-btn.active{color:#1a3a5c;font-weight:700;border-bottom-color:#1a3a5c}
.tab-btn:hover:not(.active){color:#1a3a5c;background:#f5f7fa}
/* Tab content */
.tab-content{display:none;flex:1;overflow:hidden}
.tab-content.active{display:flex;flex-direction:column}
/* Quote tab */
.quote-header{background:#fff;padding:10px 16px;border-bottom:1px solid #e0e4ea;display:flex;gap:16px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.quote-header label{font-size:11px;color:#666;margin-right:4px}
.quote-header input{border:1px solid #cdd2da;border-radius:4px;padding:5px 8px;font-size:13px;font-family:inherit}
#inp-client{width:160px}
#inp-project{width:220px}
#inp-date{width:145px}
.quote-body{display:flex;flex:1;overflow:hidden}
/* Left panel */
.left-panel{width:270px;min-width:200px;background:#fff;border-right:1px solid #e0e4ea;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.panel-title{padding:8px 12px;font-size:11px;font-weight:700;color:#666;background:#f8f9fa;border-bottom:1px solid #e8ebf0;text-transform:uppercase;letter-spacing:.5px}
.cat-select{margin:8px;padding:6px 8px;border:1px solid #cdd2da;border-radius:4px;font-size:13px;font-family:inherit;width:calc(100% - 16px)}
.item-list{flex:1;overflow-y:auto;padding:4px 8px 8px}
.item-btn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:6px 8px;margin-bottom:2px;border:1px solid transparent;border-radius:4px;background:none;cursor:pointer;font-family:inherit;font-size:12px;text-align:left;transition:all .1s}
.item-btn:hover{background:#eef2ff;border-color:#b8c5e8}
.item-name{flex:1;color:#222;word-break:keep-all}
.item-price{color:#1a3a5c;font-weight:600;margin-left:8px;white-space:nowrap;font-size:11px}
/* Right panel */
.right-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.panel-header{padding:8px 16px;background:#f8f9fa;border-bottom:1px solid #e0e4ea;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-header-title{font-size:11px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.5px}
.quote-table-wrap{flex:1;overflow-y:auto}
/* Tables */
table{width:100%;border-collapse:collapse}
th{background:#f0f2f5;padding:7px 10px;font-size:11px;font-weight:700;color:#555;border-bottom:2px solid #d0d5dc;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:6px 10px;border-bottom:1px solid #eef0f3;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafbfd}
.td-no{text-align:center;width:36px;color:#aaa;font-size:11px}
.td-num{text-align:right;white-space:nowrap}
.td-ctr{text-align:center}
.td-act{text-align:center;white-space:nowrap;width:60px}
/* Editable inputs in table */
.editable{border:none;background:transparent;font-family:inherit;font-size:13px;width:100%;padding:2px 4px;border-radius:3px;color:inherit}
.editable:focus{outline:2px solid #1a3a5c;background:#fff}
/* Totals */
.totals-bar{padding:8px 16px;background:#f8f9fa;border-top:2px solid #e0e4ea;display:flex;justify-content:flex-end;gap:28px;align-items:center;flex-shrink:0}
.total-item{font-size:12px;color:#666}
.total-item span{font-weight:700;color:#1a3a5c;font-size:13px;margin-left:6px}
.total-item.grand span{font-size:16px;color:#c0392b}
/* Action bar */
.action-bar{padding:8px 16px;background:#fff;border-top:1px solid #e0e4ea;display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
/* Buttons */
.btn{padding:6px 14px;border:none;border-radius:4px;cursor:pointer;font-size:13px;font-family:inherit;transition:all .15s;font-weight:500}
.btn-primary{background:#1a3a5c;color:#fff}
.btn-primary:hover{background:#245580}
.btn-secondary{background:#e4e8ef;color:#444}
.btn-secondary:hover{background:#d0d5dc}
.btn-danger{background:#dc3545;color:#fff}
.btn-danger:hover{background:#c82333}
.btn-success{background:#198754;color:#fff}
.btn-success:hover{background:#157347}
.btn-sm{padding:3px 9px;font-size:12px}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:8px;padding:22px;width:340px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal h3{font-size:14px;margin-bottom:14px;color:#1a3a5c}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:#666;margin-bottom:3px}
.field input{width:100%;padding:6px 8px;border:1px solid #cdd2da;border-radius:4px;font-size:13px;font-family:inherit}
.modal .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* Price tab */
#tab-price{overflow:hidden;padding:16px;flex-direction:column}
.price-toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;flex-shrink:0}
.price-toolbar h2{flex:1;font-size:15px;color:#1a3a5c;font-weight:700}
/* 좌/우 레이아웃 */
.price-body{display:flex;gap:14px;flex:1;min-height:0;overflow:hidden}
.price-sidebar{width:200px;flex-shrink:0;background:#fff;border:1px solid #e0e4ea;border-radius:6px;display:flex;flex-direction:column;overflow:hidden;align-self:flex-start;max-height:100%}
.price-sidebar-title{padding:9px 12px;background:#edf1fa;border-bottom:1px solid #dde3f0;font-weight:700;color:#1a3a5c;font-size:12px;flex-shrink:0}
.price-sidebar-nav{flex:1;overflow-y:auto;padding:6px 4px}
.price-sidebar-nav .cat-link{display:block;width:100%;padding:7px 10px;margin:1px 0;background:none;border:none;border-radius:4px;text-align:left;font-size:12px;font-family:inherit;color:#444;cursor:pointer;line-height:1.3;transition:all .12s;word-break:keep-all}
.price-sidebar-nav .cat-link:hover{background:#eef2ff;color:#1a3a5c}
.price-sidebar-nav .cat-link.active{background:#1a3a5c;color:#fff;font-weight:600}
.price-sidebar-nav .cat-link.active:hover{background:#245580}
.price-main{flex:1;min-width:0;overflow-y:auto}
.cat-card{background:#fff;border:1px solid #e0e4ea;border-radius:6px;margin-bottom:14px;overflow:hidden;scroll-margin-top:8px}
.cat-card-header{padding:9px 14px;background:#edf1fa;border-bottom:1px solid #dde3f0;display:flex;align-items:center;gap:8px}
.cat-card-title{flex:1}
.cat-card-name{font-weight:700;color:#1a3a5c;font-size:13px}
.cat-card-desc{font-size:11px;color:#888;margin-top:1px}
.price-table th{font-size:11px;padding:6px 8px}
.price-table td{font-size:12px;padding:5px 8px}
.price-table .editable{font-size:12px}
.add-item-row td{padding:6px 10px;background:#fafbfc}
/* 반응형: 좁은 화면에서는 사이드바 숨김 */
@media (max-width: 768px){
  .price-sidebar{display:none}
}
/* History tab */
#tab-history{overflow-y:auto;padding:16px;flex-direction:column}
.history-toolbar{margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.history-toolbar h2{font-size:15px;color:#1a3a5c;font-weight:700;margin:0}
.hf-main{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;row-gap:8px}
.hf-left,.hf-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hf-main input[type=text]{border:1px solid #cdd2da;border-radius:4px;padding:6px 10px;font-size:12px;font-family:inherit;background:#fff;color:#333;transition:border-color .15s}
.hf-main input[type=text]:focus{outline:2px solid #1a3a5c;outline-offset:-1px;border-color:#1a3a5c}
#hf-search-client{width:140px}
#hf-search-project{width:200px}
#hf-date-range{width:220px;cursor:pointer}
.hf-right select{border:1px solid #cdd2da;border-radius:4px;padding:5px 10px;font-size:12px;font-family:inherit;background:#fff;color:#333;max-width:200px}
.hf-right select:focus{outline:2px solid #1a3a5c;outline-offset:-1px;border-color:#1a3a5c}
.hf-reset-btn{background:#f3f4f6;color:#555;border:1px solid #cdd2da}
.hf-reset-btn:hover{background:#e5e7eb;border-color:#9ca3af;color:#1a3a5c}
/* Flatpickr 커스텀 (BELCOM 톤) */
.flatpickr-calendar.belcom-cal{box-shadow:0 10px 32px rgba(0,0,0,.18);border:1px solid #e0e4ea;border-radius:8px}
.flatpickr-calendar.belcom-cal .flatpickr-day.selected,
.flatpickr-calendar.belcom-cal .flatpickr-day.startRange,
.flatpickr-calendar.belcom-cal .flatpickr-day.endRange,
.flatpickr-calendar.belcom-cal .flatpickr-day.selected.inRange,
.flatpickr-calendar.belcom-cal .flatpickr-day.startRange.inRange,
.flatpickr-calendar.belcom-cal .flatpickr-day.endRange.inRange,
.flatpickr-calendar.belcom-cal .flatpickr-day.selected:focus,
.flatpickr-calendar.belcom-cal .flatpickr-day.startRange:focus,
.flatpickr-calendar.belcom-cal .flatpickr-day.endRange:focus,
.flatpickr-calendar.belcom-cal .flatpickr-day.selected:hover,
.flatpickr-calendar.belcom-cal .flatpickr-day.startRange:hover,
.flatpickr-calendar.belcom-cal .flatpickr-day.endRange:hover{background:#1a3a5c;border-color:#1a3a5c;color:#fff}
.flatpickr-calendar.belcom-cal .flatpickr-day.inRange{background:#e8edf5;border-color:#e8edf5;color:#1a3a5c;box-shadow:none}
.flatpickr-calendar.belcom-cal .flatpickr-day.today{border-color:#1a3a5c;color:#1a3a5c;font-weight:700}
.flatpickr-calendar.belcom-cal .flatpickr-day:hover{background:#f0f4ff;border-color:#f0f4ff}
.flatpickr-calendar.belcom-cal .flatpickr-weekdays{background:transparent}
.flatpickr-calendar.belcom-cal span.flatpickr-weekday:first-child{color:#c0392b}
.flatpickr-calendar.belcom-cal span.flatpickr-weekday:last-child{color:#1a73e8}
.flatpickr-calendar.belcom-cal .dayContainer .flatpickr-day:nth-child(7n+1):not(.selected):not(.startRange):not(.endRange):not(.inRange){color:#c0392b}
.flatpickr-calendar.belcom-cal .dayContainer .flatpickr-day:nth-child(7n):not(.selected):not(.startRange):not(.endRange):not(.inRange){color:#1a73e8}
/* 캘린더 내부 빠른 선택 버튼 (월 이동 화살표와 겹치지 않도록 months와 days 사이에 배치) */
.flatpickr-calendar.belcom-cal .hf-quick-bar{display:flex;gap:4px;padding:6px 10px;flex-wrap:wrap;background:#f8f9fa;border-top:1px solid #eef0f3;border-bottom:1px solid #eef0f3;justify-content:center}
.flatpickr-calendar.belcom-cal .hf-quick-bar button{padding:3px 10px;background:#fff;border:1px solid #cdd2da;border-radius:12px;cursor:pointer;font-size:11px;font-family:inherit;color:#555;transition:all .12s}
.flatpickr-calendar.belcom-cal .hf-quick-bar button:hover{background:#1a3a5c;border-color:#1a3a5c;color:#fff}
/* confirmDate 플러그인 '적용' 버튼 BELCOM 톤 */
.flatpickr-calendar.belcom-cal .flatpickr-confirm{background:#1a3a5c;color:#fff;font-weight:600;cursor:pointer;transition:background .12s;border-top:1px solid #122a44}
.flatpickr-calendar.belcom-cal .flatpickr-confirm:hover{background:#122a44}
.flatpickr-calendar.belcom-cal .flatpickr-confirm svg path{fill:#fff}
.history-list{display:flex;flex-direction:column;gap:8px}
.history-item{background:#fff;border:1px solid #e0e4ea;border-radius:6px;padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s}
.history-item:hover{border-color:#1a3a5c;background:#f0f4ff}
.history-meta{flex:1}
.h-client{font-weight:700;font-size:14px;color:#1a3a5c}
.h-project{font-size:12px;color:#666;margin-top:2px}
.h-date{font-size:11px;color:#999;margin-top:2px}
.history-amount{font-size:15px;font-weight:700;color:#c0392b;white-space:nowrap}
/* 세금계산서 */
.history-tax{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:150px;padding:0 8px;border-left:1px solid #e8ecf2;border-right:1px solid #e8ecf2}
.history-tax label{display:flex;align-items:center;gap:5px;font-size:11px;color:#555;cursor:pointer;user-select:none;white-space:nowrap}
.history-tax input[type=checkbox]{cursor:pointer;width:14px;height:14px;accent-color:#2a7a3a}
.history-tax input[type=date]{font-size:11px;font-family:inherit;padding:2px 4px;border:1px solid #cdd2da;border-radius:3px;width:132px}
.history-tax input[type=date]:disabled{background:#f0f0f0;color:#999;cursor:not-allowed}
.history-tax .tax-status-unissued{color:#c0392b;font-weight:600}
.history-tax .tax-status-issued{color:#2a7a3a;font-weight:600}
.history-item.tax-issued{background:#eef9ee;border-color:#c6e5c6}
.history-item.tax-issued:hover{background:#e2f3e2;border-color:#2a7a3a}
.history-item.tax-unissued{background:#fff5f0;border-color:#f0d2c0}
.history-item.tax-unissued:hover{background:#ffe8d8;border-color:#d08a4a}
/* 미진행 견적 */
.history-item.not-proceeded{background:#eeeeee;border-color:#cfcfcf}
.history-item.not-proceeded:hover{background:#e3e3e3;border-color:#9a9a9a}
.history-item.not-proceeded .history-tax{display:none}
.np-badge{display:inline-block;background:#8a8a8a;color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;margin-right:6px;letter-spacing:.3px;vertical-align:middle}
.btn-not-proceeded{background:#8a8a8a;color:#fff;border:1px solid #7a7a7a}
.btn-not-proceeded:hover{background:#6e6e6e;border-color:#5a5a5a}
.btn-proceed-restore{background:#5a7ba5;color:#fff;border:1px solid #4a6a90}
.btn-proceed-restore:hover{background:#4a6a90;border-color:#3b5779}
/* 미진행 숨기기 체크박스 */
.hf-np-hide{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#555;cursor:pointer;user-select:none;padding:4px 8px;border:1px solid #cdd2da;border-radius:4px;background:#fff;white-space:nowrap}
.hf-np-hide input{cursor:pointer;width:14px;height:14px;accent-color:#555}
.hf-np-hide:hover{background:#f6f7f9;border-color:#9ca3af}
/* Table borders */
#quote-table th,#quote-table td,.price-table th,.price-table td,.group-qtable th,.group-qtable td{border:1px solid #d2d7e2}
#quote-table th,.price-table th,.group-qtable th{border-bottom:2px solid #b0b8cc;background:#eceff5}
/* NOTE bar */
.note-bar{padding:8px 16px;background:#fffdf7;border-top:1px solid #e8e3d0;display:flex;align-items:flex-start;gap:8px;flex-shrink:0}
.note-bar>label{font-size:11px;font-weight:700;color:#888;padding-top:5px;white-space:nowrap;letter-spacing:.5px}
#inp-note{flex:1;border:1px solid #d0c8a8;border-radius:4px;padding:5px 8px;font-size:12px;font-family:inherit;resize:vertical;min-height:46px;line-height:1.6;background:#fffef9;color:#444}
#inp-note:focus{outline:2px solid #1a3a5c;background:#fff}
/* Expense section */
.expense-section{border-top:2px dashed #d0d5dc;flex-shrink:0}
.expense-toggle{width:100%;padding:7px 12px;border:none;background:none;cursor:pointer;font-size:12px;font-family:inherit;color:#1a3a5c;font-weight:600;text-align:left;display:flex;align-items:center;gap:6px}
.expense-toggle:hover{background:#eef2ff}
.expense-form-inner{padding:0 10px 10px;display:none;flex-direction:column;gap:5px}
.expense-form-inner.open{display:flex}
.expense-form-inner>div>label{font-size:11px;color:#666;display:block;margin-bottom:2px}
.expense-form-inner input{width:100%;padding:5px 7px;border:1px solid #cdd2da;border-radius:4px;font-size:12px;font-family:inherit}
.ef-row2{display:flex;gap:6px}
.ef-row2>div{flex:1}
/* Expense row highlight */
tr.expense-row td{background:#fffbee}
tr.expense-row:hover td{background:#fff5d6}
/* Misc */
.empty-msg{text-align:center;padding:36px 16px;color:#bbb;font-size:13px}
/* Group cards */
.group-card{border:2px solid #d0d5dc;border-radius:6px;overflow:hidden;background:#fff}
.group-card.active{border-color:#1a3a5c;box-shadow:0 0 0 2px #1a3a5c22}
.group-card-header{padding:7px 10px;background:#eef1f7;display:flex;align-items:center;gap:6px;flex-wrap:wrap;cursor:pointer}
.group-card-header:hover{background:#e4e8f5}
.group-name-input{border:none;background:transparent;font-weight:700;font-size:13px;color:#1a3a5c;font-family:inherit;flex:1;min-width:100px;padding:2px 4px;border-radius:3px}
.group-name-input:focus{outline:2px solid #1a3a5c;background:#fff}
.group-sublabel-input{border:1px solid transparent;background:transparent;font-size:11px;color:#888;font-family:inherit;width:150px;padding:2px 4px;border-radius:3px}
.group-sublabel-input:focus{outline:none;background:#fff;border-color:#cdd2da}
.group-subtotal-row{background:#f0f4ff;padding:5px 12px;text-align:right;font-size:11px;color:#1a3a5c;font-weight:600;border-top:1px solid #d0d8f0}
.active-group-badge{font-size:10px;color:#fff;background:#1a3a5c;padding:1px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.ungrouped-section{border:1px dashed #d0d5dc;border-radius:6px;overflow:hidden}
.ungrouped-header{padding:7px 12px;background:#f8f9fa;font-size:11px;font-weight:700;color:#888;border-bottom:1px solid #e0e4ea}
#groups-container{padding:8px;display:flex;flex-direction:column;gap:8px}
/* ===== 드래그 핸들 / 순서 이동 ===== */
.drag-handle{display:inline-flex;align-items:center;justify-content:center;width:18px;height:22px;color:#aab2c0;cursor:grab;font-size:14px;line-height:1;user-select:none;flex-shrink:0;border-radius:3px;transition:background .12s,color .12s}
.drag-handle:hover{background:#eef2ff;color:#1a3a5c}
.drag-handle:active{cursor:grabbing}
.td-drag{width:24px;padding:4px 2px;text-align:center}
.td-move{width:46px;padding:4px 2px;text-align:center;white-space:nowrap}
.move-btn{background:none;border:1px solid transparent;border-radius:3px;cursor:pointer;color:#8089a0;font-size:10px;padding:1px 3px;line-height:1;font-family:inherit;transition:all .12s}
.move-btn:not(:disabled):hover{background:#eef2ff;border-color:#b8c5e8;color:#1a3a5c}
.move-btn:disabled{color:#d0d5dc;cursor:not-allowed}
.group-drag-handle{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;color:#8595b0;cursor:grab;font-size:15px;line-height:1;user-select:none;flex-shrink:0;border-radius:3px;margin-right:2px;transition:background .12s,color .12s}
.group-drag-handle:hover{background:#dde6f5;color:#1a3a5c}
.group-drag-handle:active{cursor:grabbing}
/* Sortable ghost/chosen/drag states */
.sortable-ghost{opacity:.35;background:#eef2ff !important}
.sortable-ghost td{background:#eef2ff !important}
.sortable-chosen{cursor:grabbing !important}
.sortable-drag{opacity:.9;box-shadow:0 6px 18px rgba(26,58,92,.25)}
.group-card.sortable-ghost{opacity:.35}
tbody.sortable-ghost-container tr.sortable-ghost td{border-top:2px solid #1a3a5c !important}
/* 복사 버튼 (견적 작성 상단) */
.btn-copy-quote{display:none;background:#5a7ba5;color:#fff;padding:5px 12px;border-radius:4px;border:none;cursor:pointer;font-size:12px;font-family:inherit;font-weight:500;align-items:center;gap:4px;transition:background .15s}
.btn-copy-quote:hover{background:#4a6a90}
.btn-copy-quote.visible{display:inline-flex}
.btn-copy-quote::before{content:'⧉';font-size:14px;line-height:1}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#f0f2f5}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#aaa}
#print-area{display:none}
/* Print */
@media print{
  .app-header,.tab-nav,.tab-content,.modal-overlay{display:none!important}
  #print-area{display:block!important;font-family:'맑은 고딕','Malgun Gothic',sans-serif;font-size:10pt;color:#000}
}
/* 잠금 화면 */
#lock-screen{position:fixed;inset:0;background:#1a3a5c;display:flex;align-items:center;justify-content:center;z-index:9999}
#lock-screen.hidden{display:none}
.lock-box{background:#fff;border-radius:12px;padding:44px 52px;text-align:center;width:360px;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.lock-logo{font-size:13px;color:#888;margin-bottom:6px;font-weight:500}
.lock-title{font-size:20px;font-weight:700;color:#1a3a5c;margin-bottom:4px}
.lock-subtitle{font-size:12px;color:#aaa;margin-bottom:28px}
.lock-box input[type=email],.lock-box input[type=password]{width:100%;padding:11px 14px;border:1.5px solid #cdd2da;border-radius:6px;font-size:14px;font-family:inherit;margin-bottom:10px;text-align:center}
.lock-box input[type=password]{letter-spacing:3px}
.lock-box input[type=email]:focus,.lock-box input[type=password]:focus{outline:none;border-color:#1a3a5c}
.lock-btn{width:100%;padding:11px;background:#1a3a5c;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
.lock-btn:hover{background:#245580}
.lock-error{color:#dc3545;font-size:12px;margin-top:10px;display:none}
.lock-reset-link{display:inline-block;margin-top:14px;font-size:12px;color:#1a6fc4;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
.lock-reset-link:hover{color:#0d4a8a}
.lock-reset-link:disabled{color:#888;cursor:default;text-decoration:none}
/* 동기화 인디케이터 */
.sync-indicator{display:flex;align-items:center;gap:5px;margin-left:auto;font-size:11px;color:rgba(255,255,255,.75)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#5cb85c;flex-shrink:0}
.sync-dot.syncing{background:#f0ad4e;animation:sdpulse .9s infinite}
.sync-dot.error{background:#e74c3c}
@keyframes sdpulse{0%,100%{opacity:1}50%{opacity:.25}}
/* 로그아웃 버튼 */
.btn-logout{padding:5px 13px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:4px;cursor:pointer;font-size:12px;font-family:inherit;margin-left:12px;transition:background .15s}
.btn-logout:hover{background:rgba(255,255,255,.26)}
/* ===== 이미지 시트 ===== */
.imgsheet-section{display:none;flex-direction:column;border-left:2px solid #c0cedf;background:#f0f4fa;flex-shrink:0;width:900px;min-width:400px;overflow:hidden}
.imgsheet-section.open{display:flex}
.v-resizer{width:5px;background:#d0d8e8;cursor:col-resize;flex-shrink:0;position:relative;user-select:none;transition:background .15s}
.v-resizer:hover,.v-resizer.dragging{background:#8aaac8}
.v-resizer::after{content:'⋮';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:14px;color:#888;line-height:1;pointer-events:none}
.imgsheet-toolbar{padding:7px 14px;background:#e4ecf8;border-bottom:1px solid #c0cedf;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.imgsheet-toolbar label{font-size:12px;color:#444;display:flex;align-items:center;gap:4px}
.imgsheet-toolbar select{padding:3px 6px;border:1px solid #b0bee0;border-radius:4px;font-size:12px;font-family:inherit}
.imgsheet-drop-zone{flex:1;overflow-y:auto;padding:12px}
.imgsheet-drop-zone.drag-active{background:#d8e6f8;outline:2px dashed #1a3a5c;outline-offset:-4px}
.imgsheet-pages{display:flex;flex-direction:column;gap:20px;max-width:700px;margin:0 auto}
.is-page{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);border-radius:4px;overflow:hidden}
.is-page-num{font-size:10px;color:#aaa;padding:3px 8px;background:#f5f5f5;border-bottom:1px solid #ebebeb}
.is-grid{display:grid;aspect-ratio:210/297;padding:8px;gap:5px}
.is-cell{border:1px solid #ddd;display:flex;flex-direction:column;background:#fafafa;overflow:hidden;cursor:grab;position:relative;min-height:0}
.is-cell.drag-over{outline:2px solid #1a3a5c;background:#d8e6f8}
.is-empty-cell{background:#f7f9fc;border:2px dashed #c8d8ec;cursor:pointer;transition:background .12s}
.is-empty-cell:hover{background:#e8f0fb}
.is-add-hint{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;pointer-events:none;gap:3px}
.is-add-hint-icon{font-size:26px;color:#b0c8e8;font-weight:300;line-height:1}
.is-add-hint-text{font-size:9px;color:#a0b8d0}
.is-img-wrap{flex:1;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;background:#fff;min-height:0}
.is-img-wrap img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.is-del-btn{position:absolute;top:3px;right:3px;background:rgba(220,53,69,.85);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:10px;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1;padding:0}
.is-cell:hover .is-del-btn{display:flex}
.is-caption{padding:2px 4px;background:#f5f5f5;flex-shrink:0}
.is-caption-top{border-bottom:1px solid #e4e4e4}
.is-caption-bot{border-top:1px solid #e4e4e4}
.is-caption-input{width:100%;border:none;background:transparent;font-size:10px;font-family:inherit;color:#555;padding:1px 2px}
.is-caption-input:focus{outline:1px solid #1a3a5c;background:#fff}
.is-uploading,.is-error{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;font-size:11px;color:#888;text-align:center;padding:6px;gap:4px}
.is-error{color:#dc3545}
.is-empty-msg{text-align:center;padding:36px 16px;color:#bbb;font-size:13px}
/* ===== 셀 분할 ===== */
.is-split-btns{position:absolute;top:4px;right:4px;display:none;flex-direction:column;gap:2px;z-index:5}
.is-cell:hover .is-split-btns{display:flex}
.is-split-btn{padding:1px 5px;font-size:9px;background:rgba(255,255,255,.9);border:1px solid #b0c8e8;border-radius:3px;cursor:pointer;color:#1a3a5c;line-height:1.5;white-space:nowrap}
.is-split-btn:hover{background:#d8e8fb}
.is-merge-btn{position:absolute;top:4px;right:4px;display:none;padding:2px 6px;font-size:9px;background:#fff3cd;border:1px solid #ffc107;border-radius:3px;cursor:pointer;color:#856404;z-index:5;white-space:nowrap;line-height:1.4}
.is-cell-split:hover .is-merge-btn{display:block}
.is-cell-split{overflow:hidden}
.is-split-slot{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0;cursor:grab}
.is-empty-slot{background:#f7f9fc;border:2px dashed #c8d8ec;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:0}
.is-empty-slot:hover{background:#e8f0fb}
.is-split-img-wrap{flex:1;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;background:#fff;min-height:0}
.is-split-img-wrap img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.is-split-cap{font-size:9px;color:#555;padding:1px 3px;text-align:center;background:#f5f5f5;flex-shrink:0;border-top:1px solid #e4e4e4}
.is-split-div-h{height:2px;background:#c0cedf;flex-shrink:0}
.is-split-div-v{width:2px;background:#c0cedf;flex-shrink:0}
.is-split-slot:hover .is-del-btn{display:flex}
/* 활성 셀 */
.is-cell-active{outline:2px solid #1a6fc4 !important;outline-offset:-2px;z-index:2}
/* 분할 슬롯 활성: overflow:hidden으로 outline 클리핑되므로 inset box-shadow 사용 */
.is-split-slot.is-cell-active{box-shadow:inset 0 0 0 2px #1a6fc4 !important;outline:none !important}
/* 빈 셀: 분할 버튼 항상 표시 (hover 버그 방어) */
.is-empty-cell .is-split-btns{display:flex;opacity:0.55}
.is-empty-cell:hover .is-split-btns{opacity:1}
/* 이미지 셀: 분할 버튼 숨김 */
.is-cell:not(.is-empty-cell) .is-split-btns{display:none !important}
/* 페이지 삽입 버튼 */
.is-insert-row{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;opacity:0.35;transition:opacity .15s}
.is-insert-row:hover{opacity:1}
.is-insert-line{flex:1;height:1px;background:#aabbd4}
.is-insert-btn{background:none;border:1px solid #aabbd4;border-radius:3px;padding:2px 12px;font-size:11px;color:#4a6fa5;cursor:pointer;font-family:inherit;white-space:nowrap}
.is-insert-row:hover .is-insert-btn{background:#e8f0fb;border-color:#4a6fa5;color:#1a3a5c}
@media print{
  .imgsheet-print-page{page-break-before:always;width:100%;font-family:'맑은 고딕','Malgun Gothic',sans-serif}
  .imgsheet-print-grid{display:grid;width:100%;height:100vh;box-sizing:border-box;padding:12px;gap:8px}
  .imgsheet-print-cell{display:flex;flex-direction:column;overflow:hidden;border:1px solid #ccc}
  .imgsheet-print-img{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .imgsheet-print-img img{max-width:100%;max-height:100%;object-fit:contain}
  .imgsheet-print-cap{font-size:8pt;color:#555;padding:2px 4px;text-align:center;border-top:1px solid #eee;flex-shrink:0}
  .imgsheet-print-cap-top{border-top:none;border-bottom:1px solid #eee}
}
</style>
</head>
<body>

<!-- 로그인 잠금 화면 -->
<div id="lock-screen">
  <div class="lock-box">
    <div class="lock-logo">㈜벨콤</div>
    <div class="lock-title">견적 시스템</div>
    <div class="lock-subtitle">직원 계정으로 로그인하세요</div>
    <input type="email" id="login-email" placeholder="이메일" autocomplete="username"
      onkeydown="if(event.key==='Enter')document.getElementById('login-pw').focus()">
    <input type="password" id="login-pw" placeholder="비밀번호" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')submitLogin()">
    <button class="lock-btn" id="login-btn" onclick="submitLogin()">로그인</button>
    <div class="lock-error" id="pw-error"></div>
    <button type="button" class="lock-reset-link" id="reset-link" onclick="sendResetEmail()">비밀번호 재설정 메일 받기</button>
  </div>
</div>

<div class="app-header">
  <div>
    <div class="app-title">BELCOM 견적 시스템</div>
    <div class="app-subtitle">디자인 · 콘텐츠 · 마케팅 제작</div>
  </div>
  <div class="sync-indicator" id="sync-indicator">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-text">-</span>
  </div>
  <button class="btn-logout" onclick="logout()">로그아웃</button>
</div>

<div class="tab-nav">
  <button class="tab-btn active" onclick="switchTab(this,'quote')">견적 작성</button>
  <button class="tab-btn" onclick="switchTab(this,'price')">단가표 관리</button>
  <button class="tab-btn" onclick="switchTab(this,'history')">견적 이력</button>
</div>

<!-- TAB 1: 견적 작성 -->
<div id="tab-quote" class="tab-content active">
  <div class="quote-header">
    <div><label>수신처</label><input type="text" id="inp-client" placeholder="예: 현두상사"></div>
    <div><label>프로젝트명</label><input type="text" id="inp-project" placeholder="프로젝트명 입력"></div>
    <div><label>견적일자</label><input type="date" id="inp-date"></div>
    <button type="button" class="btn-copy-quote" id="btn-copy-current" onclick="copyCurrentQuote()" style="margin-left:auto" title="현재 견적 복사">견적 복사</button>
  </div>
  <div class="quote-body">
    <div class="left-panel" id="left-panel">
      <div class="panel-title">항목 선택</div>
      <select class="cat-select" id="cat-select" onchange="renderItemList()"></select>
      <div class="item-list" id="item-list"></div>
      <div class="expense-section">
        <button class="expense-toggle" id="expense-toggle-btn" onclick="toggleExpenseForm()">＋ 실비 항목 직접 입력</button>
        <div class="expense-form-inner" id="expense-form">
          <div><label>품명</label><input type="text" id="e-name" placeholder="실비 품명 입력"></div>
          <div class="ef-row2">
            <div><label>수량</label><input type="number" id="e-qty" value="1" min="0.01" step="any"></div>
            <div><label>단위</label><input type="text" id="e-unit" value="건"></div>
          </div>
          <div><label>공급단가 (원)</label><input type="number" id="e-price" placeholder="0"></div>
          <div><label>비고</label><input type="text" id="e-note" value="(실비)"></div>
          <button class="btn btn-primary btn-sm" onclick="addExpenseItem()" style="width:100%;margin-top:2px">추가</button>
        </div>
      </div>
    </div>
    <div class="v-resizer" id="resizer-left"></div>
    <div class="right-panel" id="center-panel">
      <div class="panel-header">
        <span class="panel-header-title">견적 내역</span>
        <span id="active-group-hint" style="font-size:11px;color:#aaa">그룹 선택 후 좌측에서 항목 추가</span>
        <button class="btn btn-primary btn-sm" onclick="addGroup()" style="margin-left:auto">+ 새 그룹 추가</button>
      </div>
      <div class="quote-table-wrap">
        <div id="groups-container"></div>
      </div>
      <div class="totals-bar">
        <div class="total-item">공급가액 <span id="total-supply">0</span>원</div>
        <div class="total-item">세액 <span id="total-tax">0</span>원</div>
        <div class="total-item grand">합계 <span id="total-grand">0</span>원</div>
      </div>
      <div class="note-bar">
        <label>NOTE</label>
        <textarea id="inp-note" rows="3">1. 상기 견적서 유효기간은 2주일 입니다.
2. 상기 견적서 타 업체 공개를 금합니다.
3. 컨텐츠 견적의 경우, 일부 수정사항 2회까지 무상 반영되며,  추가 수정은 별도 비용이 발생할 수 있습니다.</textarea>
      </div>
      <div class="action-bar">
        <button class="btn btn-success" onclick="saveQuote()">견적 저장</button>
        <button class="btn btn-primary" onclick="exportExcel()">엑셀 다운로드</button>
        <button class="btn btn-secondary" onclick="printQuote()">인쇄 / PDF</button>
        <button class="btn btn-secondary" onclick="toggleImgSheet()" id="imgsheet-toggle-btn">이미지 시트 ▶</button>
        <button class="btn btn-danger" onclick="clearQuote()">초기화</button>
      </div>
    </div>
    <div class="v-resizer" id="resizer-right" style="display:none"></div>
    <!-- 이미지 시트 섹션 (우측 패널) -->
    <div id="imgsheet-section" class="imgsheet-section">
      <div class="imgsheet-toolbar">
        <button class="btn btn-secondary btn-sm" onclick="toggleImgSheet()" style="padding:2px 8px;flex-shrink:0" title="이미지 시트 닫기">✕</button>
        <span style="font-weight:700;font-size:12px;color:#1a3a5c;flex-shrink:0">이미지 시트</span>
        <label style="flex-shrink:0">레이아웃
          <select id="is-layout-sel" onchange="updateImgSheetLayout(this.value)">
            <option value="1x1">1×1</option>
            <option value="1x2">1×2</option>
            <option value="2x1">2×1</option>
            <option value="2x2" selected>2×2</option>
            <option value="2x3">2×3</option>
            <option value="3x2">3×2</option>
            <option value="3x3">3×3</option>
          </select>
        </label>
        <span style="font-size:12px;color:#444;display:flex;align-items:center;gap:6px;flex-shrink:0">캡션
          <label style="gap:3px"><input type="radio" name="is-cap-pos" value="top" checked onchange="updateImgSheetCaption('top')"> 위</label>
          <label style="gap:3px"><input type="radio" name="is-cap-pos" value="bottom" onchange="updateImgSheetCaption('bottom')"> 아래</label>
        </span>
        <label style="font-size:12px;color:#444;display:flex;align-items:center;gap:4px;flex-shrink:0">엑셀 탭 이름
          <input type="text" id="is-sheet-name" value="이미지 시트" maxlength="31"
            style="width:110px;padding:2px 5px;border:1px solid #b0bee0;border-radius:3px;font-size:12px;font-family:inherit"
            oninput="updateImgSheetName(this.value)"
            onblur="this.value=imageSheet.sheetName||'이미지 시트'">
        </label>
        <label class="btn btn-secondary btn-sm" style="cursor:pointer;flex-shrink:0">이미지 추가
          <input type="file" accept="image/*" multiple style="display:none" onchange="handleImgSheetFiles(this.files);this.value=''">
        </label>
        <span id="is-count" style="font-size:11px;color:#aaa;margin-left:auto"></span>
      </div>
      <div class="imgsheet-drop-zone" id="imgsheet-drop-zone"
        ondragover="event.preventDefault();this.classList.add('drag-active')"
        ondragleave="this.classList.remove('drag-active')"
        ondrop="this.classList.remove('drag-active');handleImgSheetFiles(event.dataTransfer.files);event.preventDefault()">
        <div id="imgsheet-pages" class="imgsheet-pages"></div>
      </div>
      <!-- 특정 셀 위치 업로드용 숨김 파일 인풋 -->
      <input type="file" id="is-cell-picker" accept="image/*" style="display:none"

// ===== Firebase (Modular SDK는 위쪽 <script type="module">에서 초기화됨) =====
let db = null;
let fbFS = null;
let auth = null;
let fbAuthFS = null;

function _bindFirebaseRefs() {
  db = window.fbDb; fbFS = window.fbFS;
  auth = window.fbAuth; fbAuthFS = window.fbAuthFS;
}

function waitForFirebase() {
  return new Promise(resolve => {
    if (window.fbDb) { _bindFirebaseRefs(); resolve(); return; }
    window.addEventListener('firebase-ready', () => {
      _bindFirebaseRefs(); resolve();
    }, { once: true });
  });
}

function currentUserEmail() {
  return (auth && auth.currentUser && auth.currentUser.email) || '';
}

// Modular API를 compat 스타일로 호출할 수 있게 해주는 얇은 래퍼
function fsCollection(name) {
  const colRef = fbFS.collection(db, name);
  return {
    _ref: colRef,
    doc(id) {
      const docRef = fbFS.doc(db, name, id);
      return {
        _ref: docRef,
        set(data) { return fbFS.setDoc(docRef, data); },
        update(data) { return fbFS.updateDoc(docRef, data); },
        delete() { return fbFS.deleteDoc(docRef); }
      };
    },
    get() { return fbFS.getDocs(colRef); },
    onSnapshot(onNext, onError) { return fbFS.onSnapshot(colRef, onNext, onError); },
    orderBy(field, dir) {
      const q = fbFS.query(colRef, fbFS.orderBy(field, dir));
      return {
        onSnapshot(onNext, onError) { return fbFS.onSnapshot(q, onNext, onError); }
      };
    }
  };
}

function fsBatch() {
  const b = fbFS.writeBatch(db);
  return {
    set(refOrWrapper, data) { b.set(refOrWrapper._ref || refOrWrapper, data); return this; },
    delete(refOrWrapper)    { b.delete(refOrWrapper._ref || refOrWrapper);   return this; },
    commit() { return b.commit(); }
  };
}

// ===== 로그인 (Firebase Authentication) =====
// 계정은 Firebase 콘솔 > Authentication에서 관리합니다.
async function submitLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw    = document.getElementById('login-pw').value;
  const errEl = document.getElementById('pw-error');
  const btn   = document.getElementById('login-btn');
  errEl.style.display = 'none';
  errEl.textContent   = '';
  if (!email || !pw) {
    errEl.textContent = '이메일과 비밀번호를 모두 입력하세요.';
    errEl.style.display = 'block';
    return;
  }
  await waitForFirebase();
  btn.disabled = true;
  btn.textContent = '로그인 중...';
  try {
    await fbAuthFS.signInWithEmailAndPassword(auth, email, pw);
    // 이후 onAuthStateChanged가 잠금 해제 + initApp 처리
  } catch(e) {
    const code = e && e.code || '';
    console.error('[Auth] login error:', code);
    errEl.textContent = (code==='auth/invalid-credential' || code==='auth/wrong-password' ||
                         code==='auth/user-not-found' || code==='auth/invalid-email')
      ? '이메일 또는 비밀번호가 올바르지 않습니다.'
      : (code==='auth/too-many-requests' ? '시도가 많아 일시 차단되었습니다. 잠시 후 다시 시도하세요.'
      : '로그인에 실패했습니다. (' + (code || 'error') + ')');
    errEl.style.display = 'block';
    document.getElementById('login-pw').value = '';
    setTimeout(() => document.getElementById('login-pw').focus(), 30);
  } finally {
    btn.disabled = false;
    btn.textContent = '로그인';
  }
}

async function logout() {
  try {
    if (auth) await fbAuthFS.signOut(auth);
  } catch(e) {
    console.error('[Auth] signOut error:', e);
  }
  // 이후 onAuthStateChanged가 리스너 해제 + 잠금 화면 복원
}

async function sendResetEmail() {
  const link = document.getElementById('reset-link');
  let email = (document.getElementById('login-email').value || '').trim();
  if (!email) {
    email = (prompt('비밀번호를 재설정할 이메일 주소를 입력하세요:') || '').trim();
  }
  if (!email) return;
  await waitForFirebase();
  try {
    link.disabled = true;
    link.textContent = '메일 발송 중...';
    await fbAuthFS.sendPasswordResetEmail(auth, email);
    alert('비밀번호 재설정 메일을 보냈습니다.\n받은편지함(및 스팸함)을 확인하세요.');
  } catch(e) {
    const code = e && e.code || '';
    console.error('[Auth] reset error:', code);
    const msg = (code==='auth/invalid-email')      ? '이메일 형식이 올바르지 않습니다.'
              : (code==='auth/user-not-found')     ? '등록되지 않은 이메일입니다.'
              : (code==='auth/missing-email')      ? '이메일을 입력하세요.'
              : (code==='auth/too-many-requests')  ? '시도가 많아 일시 차단되었습니다. 잠시 후 다시 시도하세요.'
              : '메일 발송에 실패했습니다. (' + (code || 'error') + ')';
    alert('오류: ' + msg);
  } finally {
    link.disabled = false;
    link.textContent = '비밀번호 재설정 메일 받기';
  }
}

function loadLogoAsBase64() {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width  = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        logoBase64 = canvas.toDataURL('image/jpeg').split(',')[1];
      } catch(e) {}
      resolve();
    };
    img.onerror = () => resolve();
    img.src = '벨콤비즈니스 로고.jpg';
  });
}

// ===== Firestore: 단가표 =====
async function saveCategoryToFS(cat) {
  setSyncStatus('syncing');
  try {
    const order = Object.keys(priceData).indexOf(cat);
    await fsCollection('pricelist').doc(cat).set({ ...priceData[cat], _order: order });
    setSyncStatus('ok');
  } catch(e) {
    console.error('Firestore write error:', e);
    setSyncStatus('error', '저장 실패');
  }
}

async function deleteCategoryFromFS(cat) {
  try { await fsCollection('pricelist').doc(cat).delete(); }
  catch(e) { console.error('Firestore delete error:', e); }
}

async function saveAllPriceToFS() {
  setSyncStatus('syncing');
  try {
    const snap  = await fsCollection('pricelist').get();
    const batch = fsBatch();
    snap.forEach(d => batch.delete(d.ref));
    let ord = 0;
    Object.keys(priceData).forEach(cat => {
      batch.set(fsCollection('pricelist').doc(cat), { ...priceData[cat], _order: ord++ });
    });
    await batch.commit();
    setSyncStatus('ok');
  } catch(e) {
    console.error('Firestore batch error:', e);
    setSyncStatus('error', '저장 실패');
  }
}

// 단가표 실시간 리스너 (onSnapshot)
function setupPriceListener() {
  return new Promise(resolve => {
    let resolved = false;
    const done = () => { if (!resolved) { resolved = true; resolve(); } };
    priceUnsub = fsCollection('pricelist').onSnapshot(async snap => {
      if (snap.empty) {
        console.log('[단가표] Firestore 단가표 비어있음 — 초기 시드 수행');
        // 1순위: 같은 도메인의 단가표.json 파일을 fetch
        try {
          console.log('[단가표] 단가표.json 로딩 중...');
          const res = await fetch('단가표.json', { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          priceData = await res.json();
          console.log('[단가표] 단가표.json 로딩 완료 — 카테고리 ' + Object.keys(priceData).length + '개');
        } catch(e) {
          // 2순위: LocalStorage 캐시 또는 내장 DEFAULT_PRICE_DATA
          console.warn('[단가표] 단가표.json 로딩 실패 — 폴백 데이터 사용:', e.message);
          const lsRaw = localStorage.getItem(LS_PRICE);
          try { priceData = lsRaw ? JSON.parse(lsRaw) : clone(DEFAULT_PRICE_DATA); }
          catch(err) { priceData = clone(DEFAULT_PRICE_DATA); }
          console.log('[단가표] 폴백 데이터 카테고리 ' + Object.keys(priceData).length + '개');
        }
        console.log('[단가표] Firestore 업로드 중...');
        await saveAllPriceToFS();
        console.log('[단가표] Firestore 업로드 완료');
        done();
        return;
      }
      const sorted = snap.docs.slice().sort((a,b) => (a.data()._order||0)-(b.data()._order||0));
      const nd = {};
      sorted.forEach(d => { const {_order,...rest} = d.data(); nd[d.id] = rest; });
      priceData = nd;
      savePriceLS();
      renderCategorySelect(); renderItemList();
      if (document.getElementById('tab-price').classList.contains('active')) renderPriceTab();
      setSyncStatus('ok');
      done();
    }, err => {
      console.error('Price listener error:', err);
      setSyncStatus('error', '오프라인');
      const lsRaw = localStorage.getItem(LS_PRICE);
      try { priceData = lsRaw ? JSON.parse(lsRaw) : clone(DEFAULT_PRICE_DATA); }
      catch(e) { priceData = clone(DEFAULT_PRICE_DATA); }
      done();
    });
  });
}

window.addEventListener('popstate', (ev) => {
  // 비밀번호 화면이면 무시 (사용자가 완전히 나가게 둠)
  const lock = document.getElementById('lock-screen');
  if (lock && !lock.classList.contains('hidden')) return;
  _applyNavState(ev.state);
});

// ===== 탭 전환 (브라우저 뒤로가기 지원) =====
const TAB_BTN_IDX = { quote: 0, price: 1, history: 2 };
let _navLock = false; // popstate 처리 중 재push 방지

function _applyTabUI(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  const content = document.getElementById('tab-' + name);
  if (content) content.classList.add('active');
  const btns = document.querySelectorAll('.tab-btn');
  const idx = TAB_BTN_IDX[name];
  if (idx != null && btns[idx]) btns[idx].classList.add('active');
  if (name === 'history') renderHistory();
  if (name === 'price') renderPriceTab();
}

function _pushNavState(stateObj) {
  if (_navLock) return;
  const hash = '#' + (stateObj.tab || 'quote') + (stateObj.imgSheet ? '-img' : '');
  try { history.pushState(stateObj, '', hash); } catch(e) {}
}

function switchTab(btn, name) {
  if (_navLock) return;
  _applyTabUI(name);
  _pushNavState({ tab: name });
}

function goToQuoteTab() {
  _applyTabUI('quote');
  _pushNavState({ tab: 'quote' });
}

function _applyNavState(state) {
  _navLock = true;
  try {
    const s = state || { tab: 'quote' };
    const tab = s.tab || 'quote';
    _applyTabUI(tab);
    // 이미지 시트 상태 동기화 (견적 작성 탭에서만 의미 있음)
    const sec = document.getElementById('imgsheet-section');
    if (sec) {
      const wantOpen = !!s.imgSheet && tab === 'quote';
      const isOpen = sec.classList.contains('open');
      if (wantOpen !== isOpen) toggleImgSheet();
    }
  } finally {
    _navLock = false;
  }
}

// ===== 모달 =====
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function closeModalOnBg(e, id) { if (e.target === document.getElementById(id)) closeModal(id); }

// ===== 탭1: 견적 작성 =====
function renderCategorySelect() {
  const sel = document.getElementById('cat-select');
  const cur = sel.value;
  sel.innerHTML = Object.keys(priceData).map(k =>
    `<option value="${esc(k)}"${k===cur?' selected':''}>${k.replace(/_/g,' ')}</option>`
  ).join('');
  if (!sel.value && Object.keys(priceData).length) sel.value = Object.keys(priceData)[0];
}

function renderItemList() {
  const cat = document.getElementById('cat-select').value;
  const list = document.getElementById('item-list');
  const items = priceData[cat] ? priceData[cat].items : [];
  if (!items.length) { list.innerHTML = '<div class="empty-msg">항목이 없습니다</div>'; return; }
  list.innerHTML = items.map((item, i) =>
    `<button class="item-btn" onclick="openQtyModal('${esc(cat)}',${i})">
      <span class="item-name">${esc(item.name)}</span>
      <span class="item-price">${fmt(item.price)}/${item.unit}</span>
    </button>`
  ).join('');
}

// 수량 모달
let _pendingCat = null, _pendingIdx = null;
function openQtyModal(cat, idx) {
  _pendingCat = cat; _pendingIdx = idx;
  const item = priceData[cat].items[idx];
  document.getElementById('qty-modal-title').textContent = item.name;
  document.getElementById('m-name').value = item.name;
  document.getElementById('m-unit').value = item.unit;
  document.getElementById('m-qty').value = 1;
  document.getElementById('m-price').value = item.price;
  document.getElementById('m-note').value = item.note || '';
  document.getElementById('qty-modal').classList.add('open');
  setTimeout(() => document.getElementById('m-qty').select(), 50);
}

function addItemToQuote() {
  const name = document.getElementById('m-name').value.trim();
  if (!name) { alert('품명을 입력하세요.'); return; }
  const unit  = document.getElementById('m-unit').value.trim();
  const qty   = parseFloat(document.getElementById('m-qty').value) || 1;
  const price = parseFloat(document.getElementById('m-price').value) || 0;
  const note  = document.getElementById('m-note').value.trim();
  const newItem = { name, unit, qty, price, note };
  const grp = activeGroupId ? quoteGroups.find(g=>g.id===activeGroupId) : null;
  if (grp) grp.items.push(newItem);
  else ungroupedItems.push(newItem);
  closeModal('qty-modal');
  renderQuoteTable();
}

function renderQuoteTable() {
  const container = document.getElementById('groups-container');

  if (!quoteGroups.length && !ungroupedItems.length) {
    container.innerHTML = '<div class="empty-msg">+ 새 그룹 추가를 눌러 그룹을 만든 후<br>좌측에서 항목을 선택해 추가하세요</div>';
    updateTotals(); updateActiveGroupHint(); updateCopyQuoteBtnVisibility(); return;
  }

  const tableHead = `<thead><tr>
    <th class="td-drag" title="드래그로 이동"></th>
    <th class="td-move">이동</th>
    <th class="td-no">No.</th>
    <th style="min-width:140px">품명</th>
    <th style="width:50px">단위</th>
    <th style="width:60px">수량</th>
    <th style="width:110px">공급단가</th>
    <th style="width:110px">공급가액</th>
    <th style="width:90px">세액</th>
    <th style="min-width:80px">비고</th>
    <th class="td-act">삭제</th>
  </tr></thead>`;

  const buildRows = (items, gid) => {
    if (!items.length) return `<tr data-empty="1"><td colspan="11" class="empty-msg" style="padding:12px">이 그룹을 선택 후 좌측에서 항목을 추가하세요</td></tr>`;
    const last = items.length - 1;
    return items.map((item, i) => {
      const sup = item.qty * item.price;
      const tax = Math.round(sup * 0.1);
      const key = gid + '_' + i;
      return `<tr${item.isExpense?' class="expense-row"':''} data-item-idx="${i}">
      <td class="td-drag"><span class="drag-handle item-drag-handle" title="드래그로 이동">≡</span></td>
      <td class="td-move">
        <button class="move-btn" onclick="moveGroupItem('${gid}',${i},-1)"${i===0?' disabled':''} title="위로">▲</button>
        <button class="move-btn" onclick="moveGroupItem('${gid}',${i},1)"${i===last?' disabled':''} title="아래로">▼</button>
      </td>
      <td class="td-no">${i+1}</td>
      <td><input class="editable" value="${esc(item.name)}" onchange="updateGroupItem('${gid}',${i},'name',this.value)" style="min-width:130px;width:100%"></td>
      <td class="td-ctr"><input class="editable" value="${esc(item.unit||'')}" onchange="updateGroupItem('${gid}',${i},'unit',this.value)" style="width:44px;text-align:center"></td>
      <td class="td-num"><input class="editable" type="number" value="${item.qty}" onchange="updateGroupItem('${gid}',${i},'qty',this.value)" style="width:52px;text-align:right"></td>
      <td class="td-num"><input class="editable" type="number" value="${item.price}" onchange="updateGroupItem('${gid}',${i},'price',this.value)" style="width:100px;text-align:right"></td>
      <td class="td-num" data-sup="${key}">${fmt(sup)}</td>
      <td class="td-num" data-tax="${key}">${fmt(tax)}</td>
      <td><input class="editable" value="${esc(item.note||'')}" onchange="updateGroupItem('${gid}',${i},'note',this.value)" style="min-width:80px;width:100%"></td>
      <td class="td-act"><button class="btn btn-danger btn-sm" onclick="deleteGroupItem('${gid}',${i})">삭제</button></td>
    </tr>`;
    }).join('');
  };

  let html = quoteGroups.map((grp, gi) => {
    const isActive = grp.id === activeGroupId;
    const sub    = grp.items.reduce((s,it) => s + it.qty*it.price, 0);
    const subTax = Math.round(sub * 0.1);
    return `<div class="group-card${isActive?' active':''}" data-group-id="${grp.id}">
  <div class="group-card-header" onclick="setActiveGroup('${grp.id}')">
    <span class="group-drag-handle" onclick="event.stopPropagation()" title="그룹 드래그로 이동">⋮⋮</span>
    <input class="group-name-input" value="${esc(grp.name)}" onclick="event.stopPropagation()" onchange="updateGroup('${grp.id}','name',this.value)" placeholder="그룹 이름">
    <input class="group-sublabel-input" value="${esc(grp.subLabel||'')}" onclick="event.stopPropagation()" onchange="updateGroup('${grp.id}','subLabel',this.value)" placeholder="서브라벨 (예: 12:35 방송)">
    <label onclick="event.stopPropagation()" style="font-size:11px;color:#555;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:3px">
      <input type="checkbox"${grp.showSubtotal?' checked':''} onchange="updateGroup('${grp.id}','showSubtotal',this.checked)"> 소계표시
    </label>
    ${isActive?'<span class="active-group-badge">추가 대상</span>':''}
